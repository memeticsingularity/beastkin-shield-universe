chapters:
  - number: 1
    code: "ch-001-awakening"
    title_chinese: "觉醒"
    title_english: "Awakening"
    summary: "B-33021从培养舱中苏醒，经历标准着装序列，被编入边境巡逻小队。第一次闻到帝国空气的气味——金属、消毒水与恐惧。"
    status: "planning"
  - number: 2
    code: "ch-002-first-execution"
    title_chinese: "第一处决"
    title_english: "First Execution"
    summary: "同批次战友B-33015因违规自慰被绿袜队长当场撸杀处决。B-33021第一次目睹帝国纪律的冰冷效率，随后被命令参与对叛逃者的处决。"
    status: "planning"
  - number: 3
    code: "ch-003-snowy-watchtower"
    title_chinese: "雪山哨塔"
    title_english: "Snowy Watchtower"
    summary: "边境巡逻任务中，B-33021与另一名黑袜兵在雪山哨塔中休整。分享最后一支烟时，对方透露芯片开始出现异常——能闻到不属于帝国的气味。"
    status: "planning"
  - number: 4
    code: "ch-004-special-mission"
    title_chinese: "特殊任务"
    title_english: "Special Mission"
    summary: "B-33021被选中执行一项"特殊任务"，抵达目的地后发现这不是任务，而是罐头兵改造的选拔现场。他的芯片从未故障，那只是选拔测试的一部分。"
    status: "planning"
  - number: 5
    code: "ch-005-canned"
    title_chinese: "罐头"
    title_english: "Canned"
    summary: "改造完成。B-33021成为虎猛亲卫队的活体警戒装置，被置入立式金属培养筒中。虎猛前来"验收"，而验收的方式与帝国处决叛逃者没什么不同——只是更慢，更亲密。"
    status: "planning"
