    original_work: "bs-o-cm-1-main-story-1"
    original_title: "兽盾主线故事 第一卷·兽游世界"
    original_author: "memeticsingularity"
    adaptation_approach: "original-spinoff"
    key_changes: |
      1. First-person protagonist is a deceased player whose consciousness is uploaded into the game
      2. Protagonist gains "Save Us Then Load World" abilities — primarily save/load with memory retention across loops
      3. Genre shift from action/adventure kill-fest to utopian relationship-building / strategic tragedy
      4. Core mechanic: protagonist tries to save everyone (including nameless grunts) through trial-and-error reloads
      5. NPC delegation system: trusted companions can handle parallel crises, but may die in the attempt
      6. Trigger-event awareness: the game world runs on event locks, not real-time simulation, creating strategic windows
      7. Ethical core: no death is "acceptable"; every casualty is mourned and revisited
      8. Romantic/relationship elements with multiple Beastshield employees (galgame-inspired but not harem-collecting)
      9. Structural death (systemic violence of Beastshield) vs personal salvation as ultimate thematic conflict
      10. Memory bleed and psychological cost of retaining loop memories while others reset

