  # ============================================

  # Adaptation Information - REQUIRED for adaptation works
  # 改编信息 - 改编作品必填
  adaptation_info:
    original_work: "beastshield_setting_chinese.md"  # 基于兽盾世界观设定文档
    original_title: "兽盾世界观设定"
    original_author: "Beastkin Universe Core Team"
    adaptation_approach: "world-expansion"  # 世界观扩展
    key_changes: |
      基于兽盾世界观官方设定，创作了一系列独立的日常短篇故事，展现兽盾公司不同场景下的生活切片。
      
      创作特色：
      1. 深度挖掘官方设定中的细节：如新兵营、员工宿舍、蛋糕店等场景
      2. 扩展角色类型：G级杂兵的多样化形象与生存困境
      3. 探索日常暴力：将兽盾世界的残酷规则具象化为具体的生活场景
      4. AI深度评述：每章包含AI生成的深度角色评述，赋予每个角色完整的人性深度
      5. 感官细节强化：强调兽人的脂包肌身材、肌肉群、体味等感官描写
      6. 世界观契合：严格遵循雄兽人世界观设定（雌雄同体雄兽人，人称代词"他"）

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  last_update: "2025-12-15"
  universe_based_on: "beastshield"

  # ============================================
