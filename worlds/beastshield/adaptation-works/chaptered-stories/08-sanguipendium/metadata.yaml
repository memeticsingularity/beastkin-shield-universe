work:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  code: "bs-a-cm-1-sanguipendium"
  # Format: [world]-a-[form_type]-[natural_number]-[series_name]
  # 格式: [世界观]-a-[形式类型]-[自然数序号]-[系列名]

  title:
    chinese: "血酬淘汰赛"
    english: "Sanguipendium - The Blood Bounty Tournament"

  format: "chaptered-story"
  form_type: "cm"  # Main story adaptation
  status: "updating"
  location: "adaptation-works"  # Fixed for adaptation works

  # ============================================
  # CONDITIONALLY REQUIRED FIELDS / 条件必填字段
  # ============================================

  subtype: "main"  # For form_type: "cm", automatically main

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  promotion_status: "eligible"

  # Work Type Detail - For adaptation works
  # 作品类型细分 - 用于改编作品
  work_type: "world-building"  # Expanding the Beastshield universe with new narrative

  tags:
    - "adaptation"
    - "tournament"
    - "death-game"
    - "multi-pov"
    - "character-study"
    - "dark-themes"
    - "economic-desperation"
    - "racial-diversity"
    - "32-characters"
    - "beastshield-lore"

  # ============================================
  # OPTIONAL FIELDS / 可选字段
  # ============================================

  # Inspiration Sources - World-building based on Beastshield setting
  # 灵感来源 - 基于兽盾世界观的原创构建
  inspiration_sources:
    - type: "world-building"
      universe: "beastshield"
      description: "Original story created within Beastshield universe, exploring the economic desperation of E-rank enforcers and the brutal entertainment culture of the White Capital"

  content_warnings:
    - "extreme-violence"
    - "death"
    - "sexual-content"
    - "dark-themes"
    - "economic-desperation"
    - "gambling"
    - "suicidal-ideation"

  reading_time_estimate:
    minutes: 600  # Estimated 10+ hours for full story

  target_audience: "mature"

  # Story arc information
  story_arc:
    total_chapters: 9
    current_chapters: 5
    completion_percentage: 55

  # Character roster
  characters:
    total: 32
    by_camp:
      - camp: "ox"
        count: 8
        names: ["铁角", "铜皮", "青石", "泥蹄", "砂岩", "岩裂", "黑土", "荒原"]
      - camp: "tiger"
        count: 8
        names: ["锋牙", "烈影", "岩爪", "幼爪", "夜瞳", "风啸", "金纹", "残耳"]
      - camp: "bear"
        count: 8
        names: ["棕岩", "黑山", "白掌", "铁背", "灰耳", "厚掌", "柔毛", "冬眠"]
      - camp: "hound"
        count: 8
        names: ["灰影", "黑獒", "铁背", "疾风", "铁颚", "雪眼", "铁锁", "白毛"]
        alternate: "尖耳"

creation:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  author: "memeticsingularity"
  start_date: "2025-03-04"

  # ============================================
