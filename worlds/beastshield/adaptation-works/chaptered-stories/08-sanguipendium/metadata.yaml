  # ============================================

  promotion_status: "eligible"

  # Work Type Detail - For adaptation works
  # 作品类型细分 - 用于改编作品
  work_type: "world-building"  # Expanding the Beastshield universe with new narrative

  tags:
    - "adaptation"
    - "tournament"
    - "death-game"
    - "multi-pov"
    - "character-study"
    - "dark-themes"
    - "economic-desperation"
    - "racial-diversity"
    - "32-characters"
    - "beastshield-lore"

  # ============================================
