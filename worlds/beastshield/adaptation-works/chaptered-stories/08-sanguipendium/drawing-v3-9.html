<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血酬淘汰赛 - 32强对阵系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            display: flex;
            flex-direction: column;
        }

        /* 顶部规则区 */
        .rules-bar {
            background: rgba(233, 69, 96, 0.15);
            border-bottom: 2px solid #e94560;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .rule-item {
            font-size: 0.85em;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rule-item strong {
            color: #e94560;
        }

        .camp-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .badge-tiger { background: rgba(255, 152, 0, 0.3); color: #ff9800; }
        .badge-bear { background: rgba(121, 85, 72, 0.3); color: #8d6e63; }
        .badge-ox { background: rgba(96, 125, 139, 0.3); color: #78909c; }
        .badge-hound { background: rgba(63, 81, 181, 0.3); color: #7986cb; }

        /* 标题区 */
        .header {
            text-align: center;
            padding: 15px;
        }

        .header h1 {
            font-size: 2em;
            color: #e94560;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        .header p {
            color: #888;
            font-size: 0.9em;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 5px 20px 15px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 0.95em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #533483, #7b2cbf);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(83, 52, 131, 0.4);
        }

        .btn-accent {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-accent:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-accent:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            flex: 1;
            padding: 0 10px 20px 0;
            gap: 15px;
            overflow-x: auto;
        }

        /* 左侧选手池 - 缩小宽度 */
        .pool-sidebar {
            width: 260px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .pool-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .pool-sidebar-title {
            font-size: 0.9em;
            color: #fff;
            font-weight: bold;
        }

        .pool-sidebar-counter {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
        }

        .pool-grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            flex: 1;
            min-height: 0;
        }

        .pool-camp-box {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .pool-camp-header {
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .pool-characters-vertical {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            overflow-y: auto;
        }

        .pool-char {
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .pool-char:hover:not(.drawn):not(.disabled) {
            background: rgba(255,255,255,0.25);
            transform: translateX(3px);
        }

        .pool-char.drawn {
            opacity: 0.3;
            background: rgba(255,255,255,0.05);
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .pool-char.disabled {
            opacity: 0.4;
            background: rgba(255,255,255,0.05);
            cursor: not-allowed;
        }

        .char-code {
            font-size: 0.7em;
            opacity: 0.7;
        }

        /* Tooltip 小传提示 */
        .char-tooltip {
            position: fixed;
            background: rgba(30, 30, 50, 0.95);
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 8px;
            padding: 12px;
            width: 280px;
            z-index: 1000;
            display: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .char-tooltip.active {
            display: block;
        }

        .tooltip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tooltip-name {
            font-size: 1em;
            font-weight: bold;
            color: #e94560;
        }

        .tooltip-code {
            font-size: 0.75em;
            color: #888;
        }

        .tooltip-story {
            font-size: 0.8em;
            line-height: 1.5;
            color: #ccc;
        }

        .tooltip-info {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.75em;
            color: #888;
            display: flex;
            gap: 15px;
        }

        /* 对阵表区域 */
        .tournament-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 900px;
        }

        /* 阶段状态显示 */
        .stage-status-bar {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            padding: 10px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stage-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stage-status.completed {
            color: #4caf50;
        }

        .stage-status-text {
            font-weight: bold;
            color: #e94560;
        }

        .stage-progress {
            color: #888;
            font-size: 0.9em;
        }

        .multiplier-display {
            text-align: right;
        }

        .multiplier-label {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 2px;
        }

        .multiplier-value {
            font-size: 1.1em;
            color: #ffd700;
            font-weight: bold;
        }

        /* 奖金统计 */
        .camp-money-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85em;
        }

        .camp-money-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .camp-money-name {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .alive-count {
            color: #888;
            font-size: 0.85em;
        }

        .camp-money-value {
            color: #ffd700;
            font-weight: bold;
        }

        /* 对阵图 */
        .bracket-wrapper {
            flex: 1;
            display: flex;
            gap: 30px;
            padding: 10px;
            overflow-x: auto;
        }

        .round-section {
            display: flex;
            flex-direction: column;
            min-width: 140px;
        }

        .round-title {
            text-align: center;
            padding: 8px;
            background: rgba(233, 69, 96, 0.2);
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .round-locked {
            opacity: 0.5;
            pointer-events: none;
        }

        .round-locked::after {
            content: '🔒';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
        }

        .matches-container {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex: 1;
            gap: 8px;
        }

        .match-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .match-card:hover:not(.filled):not(.locked) {
            background: rgba(233, 69, 96, 0.1);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .match-card.filled {
            cursor: default;
        }

        .match-card.filled.winner {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .match-card.filled.loser {
            opacity: 0.5;
        }

        .match-card.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .match-card.locked::after {
            content: '🔒';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.8em;
        }

        .match-card.advance {
            cursor: pointer;
            border-color: #4caf50;
        }

        .match-card.advance:hover {
            background: rgba(76, 175, 80, 0.2);
        }

        .card-position {
            font-size: 0.7em;
            color: #666;
            position: absolute;
            top: 4px;
            left: 6px;
        }

        .card-name {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 2px;
        }

        .card-info {
            font-size: 0.7em;
            color: #888;
        }

        .card-money {
            font-size: 0.75em;
            color: #ffd700;
            margin-top: 3px;
        }

        .card-bonus-detail {
            font-size: 0.65em;
            color: #aaa;
            margin-top: 2px;
        }

        .card-empty {
            color: #555;
            font-size: 0.8em;
        }

        .tiger { border-left: 3px solid #ff9800; }
        .bear { border-left: 3px solid #8d6e63; }
        .ox { border-left: 3px solid #78909c; }
        .hound { border-left: 3px solid #7986cb; }

        /* 冠军区 */
        .champion-section {
            min-width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .champion-title {
            font-size: 1.2em;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .champion-card {
            width: 160px;
            height: 200px;
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,215,0,0.05));
            border: 2px solid #ffd700;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .champion-card.locked::after {
            content: '🔒';
            font-size: 3em;
            opacity: 0.5;
        }

        .champion-crown {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .champion-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffd700;
        }

        .champion-camp {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }

        .champion-money {
            font-size: 1em;
            color: #ffd700;
            margin-top: 10px;
            font-weight: bold;
        }

        /* 动画 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .drawing {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <!-- 规则栏 -->
    <div class="rules-bar">
        <div class="rule-item">
            <strong>阵营:</strong>
            <span class="camp-badge badge-tiger">虎族</span>
            <span class="camp-badge badge-bear">熊族</span>
            <span class="camp-badge badge-ox">牛族</span>
            <span class="camp-badge badge-hound">犬族</span>
        </div>
        <div class="rule-item">
            <strong>回避原则:</strong>
            <span>每个1/8区必须有4个不同阵营的选手</span>
        </div>
        <div class="rule-item">
            <strong>阶段控制:</strong>
            <span>32强全部产生后才能选择16强胜者，依次递进</span>
        </div>
    </div>

    <!-- 标题 -->
    <div class="header">
        <h1>血酬淘汰赛</h1>
        <p>32强对阵抽签系统 - 带阶段控制与奖金计算</p>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
        <button class="btn btn-primary" id="drawBtn" onclick="drawCharacter()">
            抽取角色
        </button>
        <button class="btn btn-secondary" onclick="autoDrawRemaining()">
            一键抽满
        </button>
        <button class="btn btn-accent" onclick="resetDraw()">
            重新开始
        </button>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 左侧选手池 -->
        <div class="pool-sidebar">
            <div class="pool-sidebar-header">
                <span class="pool-sidebar-title">选手池</span>
                <span class="pool-sidebar-counter" id="poolCounter">32</span>
            </div>
            <div class="pool-grid-2x2">
                <div class="pool-camp-box">
                    <div class="pool-camp-header">
                        <span class="camp-badge badge-tiger">虎族</span>
                    </div>
                    <div class="pool-characters-vertical" id="pool-tiger"></div>
                </div>
                <div class="pool-camp-box">
                    <div class="pool-camp-header">
                        <span class="camp-badge badge-bear">熊族</span>
                    </div>
                    <div class="pool-characters-vertical" id="pool-bear"></div>
                </div>
                <div class="pool-camp-box">
                    <div class="pool-camp-header">
                        <span class="camp-badge badge-ox">牛族</span>
                    </div>
                    <div class="pool-characters-vertical" id="pool-ox"></div>
                </div>
                <div class="pool-camp-box">
                    <div class="pool-camp-header">
                        <span class="camp-badge badge-hound">犬族</span>
                    </div>
                    <div class="pool-characters-vertical" id="pool-hound"></div>
                </div>
            </div>
        </div>

        <!-- 对阵表 -->
        <div class="tournament-container">
            <!-- 阶段状态栏 -->
            <div class="stage-status-bar">
                <div class="stage-status" id="stageStatus">
                    <span class="stage-status-text">阶段：32强抽签中</span>
                    <span class="stage-progress">需填满32个位置</span>
                </div>
                <div class="camp-money-stats" id="campMoneyStats"></div>
                <div class="multiplier-display">
                    <div class="multiplier-label">击杀奖金系数</div>
                    <div class="multiplier-value" id="multiplierValue">500 × 1 × 1 = 500</div>
                </div>
            </div>

            <!-- 对阵图 -->
            <div class="bracket-wrapper" id="bracket"></div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="char-tooltip" id="charTooltip">
        <div class="tooltip-header">
            <span class="tooltip-name" id="tooltipName"></span>
            <span class="tooltip-code" id="tooltipCode"></span>
        </div>
        <div class="tooltip-story" id="tooltipStory"></div>
        <div class="tooltip-info">
            <span id="tooltipMotive"></span>
            <span id="tooltipAge"></span>
        </div>
    </div>

    <script>
        // 角色数据 - 更新自story-setting.md
        const characters = {
            tiger: [
                { name: '雷烈', code: '虎-A', motive: '速攻', age: 28, story: '前精英侍卫，因拒绝执行屠杀平民命令而被逐出军团。' },
                { name: '寅霜', code: '虎-K', motive: '荣耀', age: 25, story: '没落将门孤女，以女身突破家族性别偏见成为战将。' },
                { name: '虎牙', code: '虎-Q', motive: '速攻', age: 30, story: '地下拳场走出的民间格斗家，嗜血而狡黠。' },
                { name: '残虎', code: '虎-J', motive: '背叛', age: 32, story: '被同僚出卖的前特战队长，以铁面具遮面。' },
                { name: '夜啸', code: '虎-10', motive: '速攻', age: 27, story: '边境马贼团首领，擅长夜袭与游击战术。' },
                { name: '狂骨', code: '虎-9', motive: '求生', age: 35, story: '死牢重犯，被许诺自由而参赛，双手沾满无辜者鲜血。' },
                { name: '金瞳', code: '虎-8', motive: '财富', age: 29, story: '曾为赏金猎人，擅长追踪与设伏。' },
                { name: '风爪', code: '虎-7', motive: '荣耀', age: 24, story: '武馆最强弟子，单纯想证明自己是最强。' }
            ],
            bear: [
                { name: '铁山', code: '熊-A', motive: '背叛', age: 38, story: '被王室剥夺爵位的熊族将军，意图重夺荣耀。' },
                { name: '黑掌', code: '熊-K', motive: '食物', age: 33, story: '因饥荒沦为盗匪的边民，体格惊人但内心怯懦。' },
                { name: '岩破', code: '熊-Q', motive: '荣耀', age: 36, story: '王室卫队的处刑人，厌倦杀戮却深陷其中。' },
                { name: '暴皮', code: '熊-J', motive: '求生', age: 29, story: '被贩卖为奴的前角斗士，渴望自由。' },
                { name: '冬眠', code: '熊-10', motive: '食物', age: 42, story: '隐世多年的老兵，为救治孙子而重出江湖。' },
                { name: '蛮锤', code: '熊-9', motive: '财富', age: 31, story: '矿场奴隶出身的力士，力大无穷但智力受损。' },
                { name: '巨座', code: '熊-8', motive: '荣耀', age: 34, story: '熊族最大佣兵团团长，为金钱与荣耀而战。' },
                { name: '灰甲', code: '熊-7', motive: '背叛', age: 37, story: '曾背叛自己军队的逃兵，寻求救赎。' }
            ],
            ox: [
                { name: '镇山', code: '牛-A', motive: '忠诚', age: 45, story: '三朝老臣，明知王室腐朽仍选择愚忠。' },
                { name: '铁犁', code: '牛-K', motive: '荣耀', age: 38, story: '农民起义领袖，为推翻暴政而参赛。' },
                { name: '犄角', code: '牛-Q', motive: '忠诚', age: 33, story: '王室铁卫统领，职责与良知的矛盾体。' },
                { name: '荒原', code: '牛-J', motive: '自由', age: 29, story: '草原游牧勇士，被绑架胁迫参赛。' },
                { name: '裂蹄', code: '牛-10', motive: '荣耀', age: 31, story: '角斗场连胜纪录保持者，只为荣耀而死。' },
                { name: '泥沼', code: '牛-9', motive: '自由', age: 27, story: '被诬陷的逃犯，希望洗清冤屈。' },
                { name: '铜皮', code: '牛-8', motive: '忠诚', age: 35, story: '退役老兵，为偿还家族债务而参赛。' },
                { name: '长角', code: '牛-7', motive: '财富', age: 30, story: '商会雇佣的保镖，单纯为赏金而战。' }
            ],
            hound: [
                { name: '影猎', code: '犬-A', motive: '荣耀', age: 30, story: '王影侍卫统领，渴望摆脱影子身份站在阳光下。' },
                { name: '月吠', code: '犬-K', motive: '忠诚', age: 26, story: '前王影成员，因爱上目标而叛逃。' },
                { name: '狂犬', code: '犬-Q', motive: '杀戮', age: 28, story: '被逐出王影的疯子，单纯享受杀戮。' },
                { name: '追风', code: '犬-J', motive: '荣耀', age: 24, story: '游侠，为追寻最强之路而参赛。' },
                { name: '暗牙', code: '犬-10', motive: '复仇', age: 32, story: '犬族灭门惨案幸存者，誓要找出幕后黑手。' },
                { name: '噬魂', code: '犬-9', motive: '杀戮', age: 29, story: '邪教杀手，以灵魂献祭为目的杀戮。' },
                { name: '疾行', code: '犬-8', motive: '自由', age: 25, story: '被通缉的飞贼，为洗脱罪名参赛。' },
                { name: '嗅血', code: '犬-7', motive: '财富', age: 31, story: '赏金猎人，嗅觉灵敏如真正的猎犬。' }
            ]
        };

        const campNames = {
            tiger: '虎族',
            bear: '熊族',
            ox: '牛族',
            hound: '犬族'
        };

        // 状态管理
        let state = {
            drawn: new Set(),
            slots: {},
            currentRound: 32,
            campAlive: { tiger: 8, bear: 8, ox: 8, hound: 8 },
            playerMoney: {},
            campMoney: { tiger: 0, bear: 0, ox: 0, hound: 0 },
            stageCompleted: { 32: false, 16: false, 8: false, 4: false, 2: false },
            stageWinners: { 32: 0, 16: 0, 8: 0, 4: 0, 2: 0 }
        };

        // 初始化
        function init() {
            renderPool();
            renderBracket();
            setupTooltip();
            updateMultiplierDisplay();
            updateStageStatus();
            updateCampMoneyStats();
            lockRounds();
        }

        // 渲染对阵表
        function renderBracket() {
            const container = document.getElementById('bracket');
            container.innerHTML = '';

            // 32强
            container.innerHTML += createRoundSection('round-32', '32强', 32, 1);
            // 16强
            container.innerHTML += createRoundSection('round-16', '16强', 16, 2);
            // 8强
            container.innerHTML += createRoundSection('round-8', '8强', 8, 3);
            // 半决赛
            container.innerHTML += createRoundSection('round-4', '半决赛', 4, 4);
            // 决赛
            container.innerHTML += createRoundSection('round-2', '决赛', 2, 5);
            // 冠军
            container.innerHTML += createChampionSection();
        }

        function createRoundSection(roundId, title, count, level) {
            let matches = '';
            for (let i = 0; i < count; i++) {
                const position = (level - 1) * 100 + i + 1;
                matches += `<div class="match-card" id="slot-32-${position}" onclick="clickSlot(${position})">
                    <span class="card-empty">位置 ${position}</span>
                </div>`;
            }

            return `
                <div class="round-section" id="${roundId}">
                    <div class="round-title">${title}</div>
                    <div class="matches-container">
                        ${matches}
                    </div>
                </div>
            `;
        }

        function createChampionSection() {
            return `
                <div class="champion-section" id="champion-section">
                    <div class="champion-title">冠军</div>
                    <div class="champion-card locked" id="champion-slot" onclick="selectChampion()">
                        <div class="champion-crown">👑</div>
                        <div class="champion-name">待揭晓</div>
                        <div class="champion-camp"></div>
                        <div class="champion-money"></div>
                    </div>
                </div>
            `;
        }

        // 获取每个1/8区已存在的阵营
        function getZoneCamps(zoneIndex) {
            const camps = new Set();
            for (let i = 0; i < 4; i++) {
                const pos = zoneIndex * 4 + i + 1;
                const slotId = `slot-32-${pos}`;
                if (state.slots[slotId]) {
                    camps.add(state.slots[slotId].camp);
                }
            }
            return camps;
        }

        // 查找可用阵营
        function getAvailableCamps() {
            const available = [];
            const camps = ['tiger', 'bear', 'ox', 'hound'];

            // 找到第一个未满的1/8区
            let targetZone = -1;
            for (let z = 0; z < 8; z++) {
                const zoneCamps = getZoneCamps(z);
                if (zoneCamps.size < 4) {
                    targetZone = z;
                    break;
                }
            }

            if (targetZone === -1) return [];

            const zoneCamps = getZoneCamps(targetZone);

            camps.forEach(camp => {
                if (!zoneCamps.has(camp) && state.campAlive[camp] > 0) {
                    // 检查该阵营还有未抽取的角色
                    const drawnFromCamp = Array.from(state.drawn).filter(id => id.startsWith(camp)).length;
                    if (drawnFromCamp < 8) {
                        available.push(camp);
                    }
                }
            });

            return available;
        }

        // 抽取角色
        function drawCharacter() {
            if (state.drawn.size >= 32) {
                alert('32强已全部产生！');
                return;
            }

            const availableCamps = getAvailableCamps();
            if (availableCamps.length === 0) {
                // 尝试自动填充
                if (autoFillEmptySlots()) {
                    updatePoolCounter();
                    updateStageStatus();
                    lockRounds();
                    return;
                }
                alert('没有可用的阵营选择！');
                return;
            }

            // 随机选择阵营
            const camp = availableCamps[Math.floor(Math.random() * availableCamps.length)];

            // 找到该阵营未抽取的角色
            let availableIndices = [];
            for (let i = 0; i < 8; i++) {
                if (!state.drawn.has(`${camp}-${i}`)) {
                    availableIndices.push(i);
                }
            }

            if (availableIndices.length === 0) {
                alert(`${campNames[camp]}没有可用角色！`);
                return;
            }

            const idx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            const char = characters[camp][idx];

            // 找到第一个空位并放置
            placeCharacterInFirstEmptySlot(camp, idx);

            // 更新UI
            updatePoolCounter();
            updateStageStatus();
            lockRounds();
        }

        // 找到第一个空位并放置
        function placeCharacterInFirstEmptySlot(camp, idx) {
            // 找到第一个未满的1/8区
            for (let z = 0; z < 8; z++) {
                const zoneCamps = getZoneCamps(z);
                if (zoneCamps.size < 4 && !zoneCamps.has(camp)) {
                    // 在该区找空位
                    for (let i = 0; i < 4; i++) {
                        const pos = z * 4 + i + 1;
                        const slotId = `slot-32-${pos}`;
                        if (!state.slots[slotId]) {
                            placeCharacter(slotId, camp, idx);
                            return;
                        }
                    }
                }
            }
        }

        // 点击选手池角色
        function clickPoolChar(camp, idx) {
            if (state.drawn.has(`${camp}-${idx}`)) return;

            // 检查是否可以放置
            const emptySlot = findFirstEmptySlot(camp);
            if (emptySlot === -1) {
                // 查看是否有任何空位可自动填充
                if (!autoFillEmptySlots()) {
                    alert('当前没有符合回避规则的空位！');
                }
                return;
            }

            placeCharacter(`slot-32-${emptySlot}`, camp, idx);
            updatePoolCounter();
            updateStageStatus();
            lockRounds();
        }

        // 找到第一个可用空位
        function findFirstEmptySlot(camp) {
            for (let z = 0; z < 8; z++) {
                const zoneCamps = getZoneCamps(z);
                if (zoneCamps.size < 4 && !zoneCamps.has(camp)) {
                    for (let i = 0; i < 4; i++) {
                        const pos = z * 4 + i + 1;
                        if (!state.slots[`slot-32-${pos}`]) {
                            return pos;
                        }
                    }
                }
            }
            return -1;
        }

        // 获取所有空位
        function getAllEmptySlots() {
            const empty = [];
            for (let pos = 1; pos <= 32; pos++) {
                if (!state.slots[`slot-32-${pos}`]) {
                    empty.push(pos);
                }
            }
            return empty;
        }

        // 计算当前奖金 - 修复：针对单个对方阵营计算
        function calculateBonus(camp) {
            const ownAlive = state.campAlive[camp];
            const ownFactor = 9 - ownAlive;

            // 计算与其他各个阵营的奖金，取最大值
            const otherCamps = Object.keys(state.campAlive).filter(c => c !== camp);
            let maxBonus = 0;
            let maxOtherFactor = 0;
            let maxOtherCamp = '';

            otherCamps.forEach(otherCamp => {
                const otherAlive = state.campAlive[otherCamp];
                const otherFactor = 9 - otherAlive;
                const bonus = 500 * ownFactor * otherFactor;

                if (bonus > maxBonus) {
                    maxBonus = bonus;
                    maxOtherFactor = otherFactor;
                    maxOtherCamp = otherCamp;
                }
            });

            // 如果没有其他阵营（理论上不会发生），返回0
            if (maxBonus === 0) {
                return { amount: 0, ownFactor, otherFactor: 0, ownAlive, otherAlive: 0 };
            }

            return {
                amount: maxBonus,
                ownFactor,
                otherFactor: maxOtherFactor,
                ownAlive,
                otherAlive: state.campAlive[maxOtherCamp]
            };
        }

        // 更新倍率显示
        function updateMultiplierDisplay() {
            const camps = ['tiger', 'bear', 'ox', 'hound'];
            let maxBonus = 0;
            let minBonus = Infinity;

            camps.forEach(camp => {
                const bonus = calculateBonus(camp);
                if (bonus.amount > maxBonus) maxBonus = bonus.amount;
                if (bonus.amount < minBonus) minBonus = bonus.amount;
            });

            const container = document.getElementById('multiplierValue');
            if (minBonus === maxBonus) {
                const sample = calculateBonus('tiger');
                container.textContent = `500 × ${sample.ownFactor} × ${sample.otherFactor} = ${maxBonus.toLocaleString()}`;
            } else {
                container.textContent = `${minBonus.toLocaleString()} - ${maxBonus.toLocaleString()}`;
            }
        }

        // 设置Tooltip - 支持选手池和已放置卡片
        function setupTooltip() {
            const tooltip = document.getElementById('charTooltip');

            document.addEventListener('mouseover', (e) => {
                // 检查是否是选手池角色
                const poolCharEl = e.target.closest('.pool-char');
                // 检查是否是已填充的卡片
                const cardEl = e.target.closest('.match-card.filled');

                let camp, idx, char;

                if (poolCharEl && !poolCharEl.classList.contains('drawn')) {
                    camp = poolCharEl.dataset.camp;
                    idx = parseInt(poolCharEl.dataset.idx);
                    char = characters[camp][idx];
                } else if (cardEl) {
                    // 从卡片ID解析角色信息
                    const slotId = cardEl.id;
                    if (state.slots[slotId]) {
                        const slotData = state.slots[slotId];
                        camp = slotData.camp;
                        idx = slotData.idx;
                        char = characters[camp][idx];
                    }
                }

                if (!char) {
                    tooltip.classList.remove('active');
                    return;
                }

                document.getElementById('tooltipName').textContent = char.name;
                document.getElementById('tooltipCode').textContent = char.code;
                document.getElementById('tooltipStory').textContent = char.story;
                document.getElementById('tooltipMotive').textContent = '动机: ' + char.motive;
                document.getElementById('tooltipAge').textContent = char.age + '岁';

                // 定位tooltip
                const targetEl = poolCharEl || cardEl;
                const rect = targetEl.getBoundingClientRect();
                let left = rect.right + 10;
                let top = rect.top;

                // 防止超出屏幕
                if (left + 280 > window.innerWidth) {
                    left = rect.left - 290;
                }
                if (top + 200 > window.innerHeight) {
                    top = window.innerHeight - 210;
                }

                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
                tooltip.classList.add('active');
            });

            document.addEventListener('mouseout', (e) => {
                const charEl = e.target.closest('.pool-char') || e.target.closest('.match-card.filled');
                if (charEl) {
                    tooltip.classList.remove('active');
                }
            });
        }

        // 渲染选手池
        function renderPool() {
            Object.keys(characters).forEach(camp => {
                const container = document.getElementById(`pool-${camp}`);
                container.innerHTML = characters[camp].map((char, idx) => {
                    const playerId = `${camp}-${idx}`;
                    const money = state.playerMoney[playerId] || 0;
                    const isDrawn = state.drawn.has(playerId);
                    return `
                    <span class="pool-char ${camp} ${isDrawn ? 'drawn' : ''}"
                          data-camp="${camp}"
                          data-idx="${idx}"
                          id="pool-${camp}-${idx}"
                          onclick="clickPoolChar('${camp}', ${idx})"
                          title="${char.motive}"
                          style="position: relative;"
                    >
                        <span>${char.name}</span>
                        <span class="char-code">${char.code}${money > 0 ? ' 💰' + money : ''}</span>
                    </span>
                `}).join('');
            });
            updatePoolDisabledState();
        }

        // 更新选手池禁用状态
        function updatePoolDisabledState() {
            if (getAllEmptySlots().length === 0) return;

            document.querySelectorAll('.pool-char').forEach(el => {
                if (el.classList.contains('drawn')) return;

                const camp = el.dataset.camp;
                const canPlace = findFirstEmptySlot(camp) !== -1;

                if (!canPlace) {
                    el.classList.add('disabled');
                } else {
                    el.classList.remove('disabled');
                }
            });
        }

        // 更新阶段状态显示
        function updateStageStatus() {
            const statusEl = document.getElementById('stageStatus');
            const emptySlots = getAllEmptySlots().length;

            if (emptySlots > 0) {
                statusEl.className = 'stage-status';
                statusEl.querySelector('.stage-status-text').textContent = '阶段：32强抽签中';
                statusEl.querySelector('.stage-progress').textContent = `需填满32个位置 (剩余${emptySlots})`;
            } else if (!state.stageCompleted[32]) {
                const needed = 16 - state.stageWinners[32];
                statusEl.className = needed === 0 ? 'stage-status completed' : 'stage-status';
                statusEl.querySelector('.stage-status-text').textContent = needed === 0 ? '阶段：16强已完成' : '阶段：16强晋级中';
                statusEl.querySelector('.stage-progress').textContent = needed === 0 ? '可进入8强' : `需选择16名胜者 (剩余${needed})`;
            } else if (!state.stageCompleted[16]) {
                const needed = 8 - state.stageWinners[16];
                statusEl.className = needed === 0 ? 'stage-status completed' : 'stage-status';
                statusEl.querySelector('.stage-status-text').textContent = needed === 0 ? '阶段：8强已完成' : '阶段：8强晋级中';
                statusEl.querySelector('.stage-progress').textContent = needed === 0 ? '可进入半决赛' : `需选择8名胜者 (剩余${needed})`;
            } else if (!state.stageCompleted[8]) {
                const needed = 4 - state.stageWinners[8];
                statusEl.className = needed === 0 ? 'stage-status completed' : 'stage-status';
                statusEl.querySelector('.stage-status-text').textContent = needed === 0 ? '阶段：半决赛已完成' : '阶段：半决赛晋级中';
                statusEl.querySelector('.stage-progress').textContent = needed === 0 ? '可进入决赛' : `需选择4名胜者 (剩余${needed})`;
            } else if (!state.stageCompleted[4]) {
                const needed = 2 - state.stageWinners[4];
                statusEl.className = needed === 0 ? 'stage-status completed' : 'stage-status';
                statusEl.querySelector('.stage-status-text').textContent = needed === 0 ? '阶段：决赛已完成' : '阶段：决赛晋级中';
                statusEl.querySelector('.stage-progress').textContent = needed === 0 ? '可选择冠军' : `需选择2名胜者 (剩余${needed})`;
            } else {
                statusEl.className = 'stage-status completed';
                statusEl.querySelector('.stage-status-text').textContent = '阶段：比赛结束';
                statusEl.querySelector('.stage-progress').textContent = '冠军已产生';
            }
        }

        // 更新阵营奖金统计
        function updateCampMoneyStats() {
            const container = document.getElementById('campMoneyStats');
            const camps = ['tiger', 'bear', 'ox', 'hound'];

            container.innerHTML = camps.map(camp => {
                const alive = state.campAlive[camp];
                const totalMoney = state.campMoney[camp];
                return `
                    <div class="camp-money-item">
                        <span class="camp-money-name">
                            <span class="badge-${camp}">${campNames[camp]}</span>
                            <span class="alive-count">(存活${alive})</span>
                        </span>
                        <span class="camp-money-value">${totalMoney.toLocaleString()}</span>
                    </div>
                `;
            }).join('');
        }

        // 锁定/解锁轮次
        function lockRounds() {
            if (getAllEmptySlots().length > 0) {
                lockRound(16); lockRound(8); lockRound(4); lockRound(2);
                lockChampion();
            } else if (!state.stageCompleted[32]) {
                unlockRound(16); lockRound(8); lockRound(4); lockRound(2);
                lockChampion();
            } else if (!state.stageCompleted[16]) {
                unlockRound(16); unlockRound(8); lockRound(4); lockRound(2);
                lockChampion();
            } else if (!state.stageCompleted[8]) {
                unlockRound(16); unlockRound(8); unlockRound(4); lockRound(2);
                lockChampion();
            } else if (!state.stageCompleted[4]) {
                unlockRound(16); unlockRound(8); unlockRound(4); unlockRound(2);
                lockChampion();
            } else {
                unlockRound(16); unlockRound(8); unlockRound(4); unlockRound(2);
                unlockChampion();
            }
        }

        function lockRound(roundNum) {
            const section = document.getElementById(`round-${roundNum}`);
            if (!section) return;
            section.classList.add('round-locked');
            section.querySelectorAll('.match-card').forEach(card => {
                card.classList.add('locked');
            });
        }

        function unlockRound(roundNum) {
            const section = document.getElementById(`round-${roundNum}`);
            if (!section) return;
            section.classList.remove('round-locked');
            section.querySelectorAll('.match-card').forEach(card => {
                card.classList.remove('locked');
            });
        }

        function lockChampion() {
            const champ = document.getElementById('champion-slot');
            if (champ) champ.classList.add('locked');
        }

        function unlockChampion() {
            const champ = document.getElementById('champion-slot');
            if (champ) champ.classList.remove('locked');
        }

        // 点击位置
        function clickSlot(position) {
            const slotId = `slot-${position}`;

            // 检查是否是晋级选择
            if (position >= 101 && position <= 116) {
                // 16强
                if (getAllEmptySlots().length > 0) {
                    alert('请先完成32强抽签！');
                    return;
                }
                if (state.stageCompleted[32]) {
                    selectWinner(position, 32);
                }
            } else if (position >= 201 && position <= 208) {
                // 8强
                if (!state.stageCompleted[32]) {
                    alert('请先完成16强晋级！');
                    return;
                }
                if (state.stageCompleted[16]) {
                    selectWinner(position, 16);
                }
            } else if (position >= 301 && position <= 304) {
                // 半决赛
                if (!state.stageCompleted[16]) {
                    alert('请先完成8强晋级！');
                    return;
                }
                if (state.stageCompleted[8]) {
                    selectWinner(position, 8);
                }
            } else if (position >= 401 && position <= 402) {
                // 决赛
                if (!state.stageCompleted[8]) {
                    alert('请先完成半决赛晋级！');
                    return;
                }
                if (state.stageCompleted[4]) {
                    selectWinner(position, 4);
                }
            }
        }

        // 选择胜者
        function selectWinner(position, fromRound) {
            const slotId = `slot-${position}`;
            const sourceIds = getSourceSlots(position, fromRound);

            // 检查源位置是否都有角色
            const availableSources = sourceIds.filter(id => state.slots[id]);
            if (availableSources.length < 2) {
                alert('上一轮未完成！');
                return;
            }

            // 检查是否已选择
            if (state.slots[slotId]) {
                // 取消选择
                undoWinner(position, fromRound);
                return;
            }

            // 显示选择对话框
            const char1 = state.slots[sourceIds[0]];
            const char2 = state.slots[sourceIds[1]];

            const choice = confirm(`选择胜者：\n确定: ${char1.name} (${char1.code})\n取消: ${char2.name} (${char2.code})`);

            const winner = choice ? char1 : char2;
            const loser = choice ? char2 : char1;
            const winnerSourceId = choice ? sourceIds[0] : sourceIds[1];
            const loserSourceId = choice ? sourceIds[1] : sourceIds[0];

            // 放置胜者
            placeWinner(slotId, winner, loser, winnerSourceId, loserSourceId, fromRound);
        }

        // 获取源位置
        function getSourceSlots(position, fromRound) {
            if (fromRound === 32) {
                // 32强 -> 16强
                const idx = position - 101;
                return [`slot-32-${idx * 2 + 1}`, `slot-32-${idx * 2 + 2}`];
            } else if (fromRound === 16) {
                // 16强 -> 8强
                const idx = position - 201;
                return [`slot-16-${idx * 2 + 1}`, `slot-16-${idx * 2 + 2}`];
            } else if (fromRound === 8) {
                // 8强 -> 半决赛
                const idx = position - 301;
                return [`slot-8-${idx * 2 + 1}`, `slot-8-${idx * 2 + 2}`];
            } else if (fromRound === 4) {
                // 半决赛 -> 决赛
                const idx = position - 401;
                return [`slot-4-${idx * 2 + 1}`, `slot-4-${idx * 2 + 2}`];
            }
            return [];
        }

        // 放置胜者
        function placeWinner(slotId, winner, loser, winnerSourceId, loserSourceId, fromRound) {
            state.slots[slotId] = { ...winner };

            // 计算奖金
            const bonus = calculateBonus(winner.camp);

            // 发放奖金
            const playerId = `${winner.camp}-${winner.idx}`;
            if (!state.playerMoney[playerId]) state.playerMoney[playerId] = 0;
            state.playerMoney[playerId] += bonus.amount;
            state.campMoney[winner.camp] += bonus.amount;

            // 更新存活人数
            if (loserSourceId && state.slots[loserSourceId]) {
                const opponent = state.slots[loserSourceId];
                state.campAlive[opponent.camp]--;
            }

            // 更新统计
            state.stageWinners[fromRound]++;

            // 检查是否完成该阶段
            const neededWinners = fromRound === 32 ? 16 : fromRound === 16 ? 8 : fromRound === 8 ? 4 : 2;
            if (state.stageWinners[fromRound] >= neededWinners) {
                state.stageCompleted[fromRound] = true;
            }

            // 更新UI
            updateMatchCard(slotId, winner, bonus);
            markAsLoser(loserSourceId);
            updateMultiplierDisplay();
            updateStageStatus();
            updateCampMoneyStats();
            lockRounds();

            // 更新选手池显示
            renderPool();
        }

        // 标记为败者
        function markAsLoser(slotId) {
            const card = document.getElementById(slotId);
            if (card) {
                card.classList.add('loser');
                card.classList.remove('advance');
                // 移除奖金预估显示
                const bonusDetail = card.querySelector('.card-bonus-detail');
                if (bonusDetail) bonusDetail.remove();
            }
        }

        // 撤销胜者选择
        function undoWinner(position, fromRound) {
            const slotId = `slot-${position}`;
            const sourceIds = getSourceSlots(position, fromRound);

            if (!state.slots[slotId]) return;

            const winner = state.slots[slotId];

            // 扣除奖金
            const bonus = calculateBonus(winner.camp);
            const playerId = `${winner.camp}-${winner.idx}`;

            if (state.playerMoney[playerId]) {
                state.playerMoney[playerId] -= bonus.amount;
                if (state.playerMoney[playerId] < 0) state.playerMoney[playerId] = 0;
            }
            state.campMoney[winner.camp] -= bonus.amount;
            if (state.campMoney[winner.camp] < 0) state.campMoney[winner.camp] = 0;

            // 恢复败者存活
            const loserSourceId = sourceIds.find(id => {
                const slot = state.slots[id];
                return slot && (slot.name !== winner.name || slot.code !== winner.code);
            });

            if (loserSourceId && state.slots[loserSourceId]) {
                const opponent = state.slots[loserSourceId];
                state.campAlive[opponent.camp]++;
            }

            // 删除该位置
            delete state.slots[slotId];

            // 更新统计
            state.stageWinners[fromRound]--;
            state.stageCompleted[fromRound] = false;

            // 更新UI
            const card = document.getElementById(slotId);
            if (card) {
                card.className = 'match-card';
                const position = parseInt(slotId.split('-')[2]);
                const roundName = position < 200 ? '16强' : position < 300 ? '8强' : position < 400 ? '半决赛' : '决赛';
                const posInRound = position < 200 ? position - 100 : position < 300 ? position - 200 : position < 400 ? position - 300 : position - 400;
                card.innerHTML = `
                    <span class="card-empty">${roundName} #${posInRound}</span>
                `;
            }

            // 恢复败者样式
            sourceIds.forEach(id => {
                const card = document.getElementById(id);
                if (card && state.slots[id]) {
                    const char = state.slots[id];
                    const playerId = `${char.camp}-${char.idx}`;
                    const totalMoney = state.playerMoney[playerId] || 0;
                    const nextBonus = calculateBonus(char.camp);
                    const nextBonusText = `预计下轮 💰${nextBonus.amount.toLocaleString()} (500×${nextBonus.ownFactor}×${nextBonus.otherFactor})`;

                    card.className = `match-card filled ${char.camp} advance`;
                    card.innerHTML = `
                        <div class="card-position">#${id.split('-')[2]}</div>
                        <div class="card-name">${char.name}</div>
                        <div class="card-info">${char.code} · ${char.motive}</div>
                        <div class="card-money">累计 💰 ${totalMoney.toLocaleString()}</div>
                        <div class="card-bonus-detail">${nextBonusText}</div>
                    `;
                }
            });

            updateMultiplierDisplay();
            updateStageStatus();
            updateCampMoneyStats();
            lockRounds();
            renderPool();
        }

        // 更新比赛卡片
        function updateMatchCard(slotId, char, bonus) {
            const card = document.getElementById(slotId);
            if (!card) return;

            const playerId = `${char.camp}-${char.idx}`;
            const totalMoney = state.playerMoney[playerId] || 0;
            const position = parseInt(slotId.split('-')[2]);
            const roundName = position < 200 ? '16强' : position < 300 ? '8强' : position < 400 ? '半决赛' : '决赛';
            const posInRound = position < 200 ? position - 100 : position < 300 ? position - 200 : position < 400 ? position - 300 : position - 400;

            const nextBonus = calculateBonus(char.camp);
            const nextBonusText = nextBonus.amount > 0 ?
                `预计下轮 💰${nextBonus.amount.toLocaleString()} (500×${nextBonus.ownFactor}×${nextBonus.otherFactor})` : '';

            card.className = `match-card filled ${char.camp} advance`;
            card.innerHTML = `
                <div class="card-position">${roundName} #${posInRound}</div>
                <div class="card-name">${char.name}</div>
                <div class="card-info">${char.code} · ${char.motive}</div>
                <div class="card-money">累计 💰 ${totalMoney.toLocaleString()}</div>
                ${nextBonusText ? `<div class="card-bonus-detail">${nextBonusText}</div>` : ''}
            `;
        }

        // 选择冠军
        function selectChampion() {
            if (!state.stageCompleted[4]) {
                alert('请先完成决赛晋级！');
                return;
            }

            if (state.slots['slot-501']) {
                // 撤销冠军
                undoChampion();
                return;
            }

            const sourceIds = ['slot-401', 'slot-402'];
            const availableSources = sourceIds.filter(id => state.slots[id]);
            if (availableSources.length < 2) {
                alert('决赛选手未全部确定！');
                return;
            }

            const char1 = state.slots['slot-401'];
            const char2 = state.slots['slot-402'];

            const choice = confirm(`选择冠军：\n确定: ${char1.name} (${char1.code})\n取消: ${char2.name} (${char2.code})`);

            const winner = choice ? char1 : char2;
            const loser = choice ? char2 : char1;
            const loserSourceId = choice ? 'slot-402' : 'slot-401';

            // 发放最后一轮奖金
            const bonus = calculateBonus(winner.camp);
            const playerId = `${winner.camp}-${winner.idx}`;
            if (!state.playerMoney[playerId]) state.playerMoney[playerId] = 0;
            state.playerMoney[playerId] += bonus.amount;
            state.campMoney[winner.camp] += bonus.amount;

            // 更新存活人数
            state.campAlive[loser.camp]--;

            // 更新冠军显示
            const champCard = document.getElementById('champion-slot');
            champCard.className = `champion-card ${winner.camp}`;
            champCard.innerHTML = `
                <div class="champion-crown">👑</div>
                <div class="champion-name">${winner.name}</div>
                <div class="champion-camp">${campNames[winner.camp]} · ${winner.code}</div>
                <div class="champion-money">总奖金: 💰 ${state.playerMoney[playerId].toLocaleString()}</div>
            `;

            // 标记败者
            markAsLoser(loserSourceId);

            // 更新状态
            state.slots['slot-501'] = { ...winner };
            state.stageWinners[2] = 1;
            state.stageCompleted[2] = true;

            updateMultiplierDisplay();
            updateStageStatus();
            updateCampMoneyStats();
            lockRounds();
            renderPool();

            setTimeout(() => {
                alert(`🏆 冠军诞生！\n\n${winner.name} (${winner.code})\n阵营：${campNames[winner.camp]}\n总奖金：💰 ${state.playerMoney[playerId].toLocaleString()}`);
            }, 300);
        }

        // 撤销冠军
        function undoChampion() {
            if (!state.slots['slot-501']) return;

            const winner = state.slots['slot-501'];
            const bonus = calculateBonus(winner.camp);
            const playerId = `${winner.camp}-${winner.idx}`;

            // 扣除奖金
            if (state.playerMoney[playerId]) {
                state.playerMoney[playerId] -= bonus.amount;
                if (state.playerMoney[playerId] < 0) state.playerMoney[playerId] = 0;
            }
            state.campMoney[winner.camp] -= bonus.amount;
            if (state.campMoney[winner.camp] < 0) state.campMoney[winner.camp] = 0;

            // 恢复另一个决赛选手的存活
            const otherSlot = winner.name === state.slots['slot-401']?.name ? 'slot-402' : 'slot-401';
            if (state.slots[otherSlot]) {
                state.campAlive[state.slots[otherSlot].camp]++;
            }

            // 恢复决赛选手样式
            ['slot-401', 'slot-402'].forEach(id => {
                const card = document.getElementById(id);
                if (card && state.slots[id]) {
                    const char = state.slots[id];
                    const pid = `${char.camp}-${char.idx}`;
                    const totalMoney = state.playerMoney[pid] || 0;
                    card.className = `match-card filled ${char.camp} advance`;
                    card.innerHTML = `
                        <div class="card-position">决赛 #${id === 'slot-401' ? 1 : 2}</div>
                        <div class="card-name">${char.name}</div>
                        <div class="card-info">${char.code} · ${char.motive}</div>
                        <div class="card-money">累计 💰 ${totalMoney.toLocaleString()}</div>
                    `;
                }
            });

            // 重置冠军卡
            const champCard = document.getElementById('champion-slot');
            champCard.className = 'champion-card locked';
            champCard.innerHTML = `
                <div class="champion-crown">👑</div>
                <div class="champion-name">待揭晓</div>
                <div class="champion-camp"></div>
                <div class="champion-money"></div>
            `;

            delete state.slots['slot-501'];
            state.stageWinners[2] = 0;
            state.stageCompleted[2] = false;

            updateMultiplierDisplay();
            updateStageStatus();
            updateCampMoneyStats();
            lockRounds();
            renderPool();
        }

        // 放置角色到指定位置
        function placeCharacter(slotId, camp, idx) {
            const char = characters[camp][idx];
            state.slots[slotId] = { ...char, camp, idx };
            state.drawn.add(`${camp}-${idx}`);

            // 更新UI
            const card = document.getElementById(slotId);
            const position = parseInt(slotId.split('-')[2]);

            // 设置卡片样式
            card.className = `match-card filled ${camp} advance`;

            // 计算预计奖金
            const bonus = calculateBonus(camp);
            const bonusText = `预计下轮 💰${bonus.amount.toLocaleString()} (500×${bonus.ownFactor}×${bonus.otherFactor})`;

            card.innerHTML = `
                <div class="card-position">#${position}</div>
                <div class="card-name">${char.name}</div>
                <div class="card-info">${char.code} · ${char.motive}</div>
                <div class="card-money">💰 0</div>
                <div class="card-bonus-detail">${bonusText}</div>
            `;

            // 更新选手池状态
            const poolChar = document.getElementById(`pool-${camp}-${idx}`);
            if (poolChar) {
                poolChar.classList.add('drawn');
            }

            updatePoolDisabledState();
        }

        // 更新选手池计数
        function updatePoolCounter() {
            const remaining = 32 - state.drawn.size;
            document.getElementById('poolCounter').textContent = remaining;
        }

        // 重置
        function resetDraw() {
            if (!confirm('确定要重新开始吗？所有进度将丢失！')) return;

            state = {
                drawn: new Set(),
                slots: {},
                currentRound: 32,
                campAlive: { tiger: 8, bear: 8, ox: 8, hound: 8 },
                playerMoney: {},
                campMoney: { tiger: 0, bear: 0, ox: 0, hound: 0 },
                stageCompleted: { 32: false, 16: false, 8: false, 4: false, 2: false },
                stageWinners: { 32: 0, 16: 0, 8: 0, 4: 0, 2: 0 }
            };

            renderPool();
            renderBracket();
            updatePoolCounter();
            updateMultiplierDisplay();
            updateStageStatus();
            updateCampMoneyStats();
            lockRounds();
        }

        // 自动填充空位
        function autoFillEmptySlots() {
            let filled = false;
            for (let z = 0; z < 8; z++) {
                const zoneCamps = getZoneCamps(z);
                if (zoneCamps.size >= 4) continue;

                for (let i = 0; i < 4; i++) {
                    const pos = z * 4 + i + 1;
                    const slotId = `slot-32-${pos}`;

                    if (!state.slots[slotId]) {
                        // 找到该位置需要的阵营
                        const neededCamp = findNeededCampForZone(z);
                        if (neededCamp) {
                            // 找该阵营未抽取的角色
                            for (let idx = 0; idx < 8; idx++) {
                                if (!state.drawn.has(`${neededCamp}-${idx}`)) {
                                    placeCharacter(slotId, neededCamp, idx);
                                    filled = true;
                                    break;
                                }
                            }
                        }
                    }
                }
            }
            return filled;
        }

        // 查找区域需要的阵营
        function findNeededCampForZone(zoneIndex) {
            const zoneCamps = getZoneCamps(zoneIndex);
            const camps = ['tiger', 'bear', 'ox', 'hound'];
            for (let camp of camps) {
                if (!zoneCamps.has(camp)) {
                    const drawnFromCamp = Array.from(state.drawn).filter(id => id.startsWith(camp)).length;
                    if (drawnFromCamp < 8) {
                        return camp;
                    }
                }
            }
            return null;
        }

        // 一键抽满剩余位置
        async function autoDrawRemaining() {
            if (state.drawn.size >= 32) {
                alert('32强已经全部产生！');
                return;
            }

            const btn = document.querySelector('.btn-secondary');
            btn.disabled = true;
            btn.textContent = '抽取中...';

            // 关闭tooltip
            document.getElementById('charTooltip').classList.remove('active');

            while (state.drawn.size < 32) {
                const availableCamps = getAvailableCamps();
                if (availableCamps.length === 0) {
                    autoFillEmptySlots();
                    break;
                }

                const camp = availableCamps[Math.floor(Math.random() * availableCamps.length)];
                let availableIndices = [];
                for (let i = 0; i < 8; i++) {
                    if (!state.drawn.has(`${camp}-${i}`)) {
                        availableIndices.push(i);
                    }
                }

                if (availableIndices.length === 0) continue;

                const idx = availableIndices[Math.floor(Math.random() * availableIndices.length)];

                // 高亮效果
                const poolChar = document.getElementById(`pool-${camp}-${idx}`);
                if (poolChar) {
                    poolChar.style.background = 'rgba(233, 69, 96, 0.5)';
                    poolChar.style.transform = 'scale(1.1)';
                }

                await new Promise(r => setTimeout(r, 150));

                placeCharacterInFirstEmptySlot(camp, idx);
                updatePoolCounter();

                if (poolChar) {
                    poolChar.style.background = '';
                    poolChar.style.transform = '';
                }

                await new Promise(r => setTimeout(r, 100));
            }

            updateStageStatus();
            lockRounds();

            btn.disabled = false;
            btn.textContent = '一键抽满';

            // 显示完成提示
            setTimeout(() => {
                alert(`32强抽签完成！\n点击16强位置选择晋级选手。`);
            }, 300);
        }

        // 启动
        init();
    </script>
</body>
</html>
