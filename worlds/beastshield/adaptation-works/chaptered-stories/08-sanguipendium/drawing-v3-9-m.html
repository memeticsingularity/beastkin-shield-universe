<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血酬淘汰赛 - 移动端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        /* 顶部规则区 - 移动端简化 */
        .rules-bar {
            background: rgba(233, 69, 96, 0.15);
            border-bottom: 2px solid #e94560;
            padding: 8px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.75em;
        }

        .rule-item {
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rule-item strong {
            color: #e94560;
        }

        .camp-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
        }

        .badge-tiger { background: rgba(255, 152, 0, 0.3); color: #ff9800; }
        .badge-bear { background: rgba(121, 85, 72, 0.3); color: #8d6e63; }
        .badge-ox { background: rgba(96, 125, 139, 0.3); color: #78909c; }
        .badge-hound { background: rgba(63, 81, 181, 0.3); color: #7986cb; }

        /* 标题区 */
        .header {
            text-align: center;
            padding: 10px;
        }

        .header h1 {
            font-size: 1.5em;
            color: #e94560;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 3px;
        }

        .header p {
            color: #888;
            font-size: 0.8em;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 5px 10px 10px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 0.9em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            min-height: 44px;
            touch-action: manipulation;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73e54);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #533483, #7b2cbf);
            color: white;
        }

        .btn-accent {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-accent:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* 轮次切换标签 */
        .round-tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 5px 10px;
            background: rgba(0,0,0,0.2);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .round-tab {
            padding: 8px 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 4px;
            color: #888;
            font-size: 0.8em;
            cursor: pointer;
            white-space: nowrap;
            min-height: 36px;
        }

        .round-tab.active {
            background: #e94560;
            color: white;
        }

        .round-tab:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 主内容区 - 移动端垂直布局 */
        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 10px;
            gap: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 选手池 - 移动端横向滑动 */
        .pool-section {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
        }

        .pool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .pool-title {
            font-size: 0.9em;
            color: #fff;
            font-weight: bold;
        }

        .pool-counter {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
        }

        .pool-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 5px;
        }

        .pool-camp-box {
            flex: 0 0 auto;
            width: 140px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px;
        }

        .pool-camp-header {
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .pool-characters {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pool-char {
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85em;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 36px;
        }

        .pool-char:hover:not(.drawn):not(.disabled) {
            background: rgba(255,255,255,0.2);
        }

        .pool-char.drawn {
            opacity: 0.3;
            background: rgba(255,255,255,0.05);
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .pool-char.disabled {
            opacity: 0.4;
            background: rgba(255,255,255,0.05);
            cursor: not-allowed;
        }

        .char-code {
            font-size: 0.7em;
            opacity: 0.7;
        }

        /* 对阵区 - 移动端 */
        .bracket-section {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bracket-title {
            font-size: 0.9em;
            color: #e94560;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .match-number {
            font-size: 0.75em;
            color: #666;
            min-width: 30px;
        }

        .match-players {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .match-player {
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            min-height: 40px;
            transition: all 0.2s;
        }

        .match-player.empty {
            color: #666;
            justify-content: center;
            cursor: default;
        }

        .match-player.winner {
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.5);
            border: 1px solid #e94560;
        }

        .match-player.eliminated {
            opacity: 0.3;
            filter: grayscale(0.8);
        }

        .match-player.tiger { border-left: 3px solid #ff9800; background: rgba(255, 152, 0, 0.1); }
        .match-player.bear { border-left: 3px solid #8d6e63; background: rgba(121, 85, 72, 0.1); }
        .match-player.ox { border-left: 3px solid #78909c; background: rgba(96, 125, 139, 0.1); }
        .match-player.hound { border-left: 3px solid #7986cb; background: rgba(63, 81, 181, 0.1); }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 0.9em;
            font-weight: 600;
        }

        .player-meta {
            font-size: 0.7em;
            color: #888;
        }

        .player-money {
            font-size: 0.75em;
            color: #ffd700;
        }

        .vs-divider {
            font-size: 0.7em;
            color: #666;
            text-align: center;
            padding: 2px 0;
        }

        /* 冠军区 */
        .champion-section {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2), rgba(201, 55, 84, 0.3));
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 10px;
        }

        .champion-title {
            color: #e94560;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .champion-card {
            padding: 15px;
        }

        .champion-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }

        .champion-camp {
            font-size: 0.9em;
            color: #e94560;
            margin-top: 5px;
        }

        .champion-money {
            font-size: 1.1em;
            color: #ffd700;
            margin-top: 10px;
            font-weight: bold;
        }

        .champion-empty {
            color: #666;
            padding: 20px;
        }

        /* 统计面板 */
        .stats-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .stats-box {
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 10px;
        }

        .stats-title {
            font-size: 0.75em;
            color: #888;
            margin-bottom: 5px;
        }

        .stats-value {
            font-size: 1.1em;
            color: #ffd700;
            font-weight: bold;
        }

        .camp-stats {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .camp-stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
        }

        /* 底部固定栏 */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            z-index: 100;
        }

        .bottom-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
        }

        /* Modal 弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .modal-title {
            color: #e94560;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .modal-text {
            color: #ccc;
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-close {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
        }

        /* 选手详情弹窗 */
        .char-modal-content {
            background: rgba(30, 30, 50, 0.98);
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
        }

        .char-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .char-modal-name {
            font-size: 1.2em;
            color: #e94560;
            font-weight: bold;
        }

        .char-modal-code {
            font-size: 0.8em;
            color: #888;
        }

        .char-modal-story {
            font-size: 0.9em;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 15px;
        }

        .char-modal-info {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
        }

        .char-modal-info-item {
            display: flex;
            gap: 5px;
        }

        .char-modal-label {
            color: #888;
        }

        .char-modal-value {
            color: #ff9800;
        }

        /* 抽签动画 */
        .draw-modal-content {
            animation: drawIn 0.5s ease;
        }

        @keyframes drawIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .draw-camp {
            font-size: 1em;
            margin-bottom: 10px;
        }

        .draw-name {
            font-size: 2em;
            color: #e94560;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .draw-position {
            font-size: 1em;
            color: #888;
        }

        /* 阶段提示 */
        .stage-hint {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            margin: 10px;
            text-align: center;
            font-size: 0.8em;
        }

        .stage-hint.completed {
            background: rgba(76, 175, 80, 0.1);
            border-color: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        /* 隐藏滚动条 */
        .pool-scroll::-webkit-scrollbar,
        .bracket-section::-webkit-scrollbar {
            display: none;
        }

        /* 占位，避免被底部栏遮挡 */
        .bottom-spacer {
            height: 70px;
        }

        /* 锁定提示 */
        .locked-hint {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <!-- 顶部规则 -->
    <div class="rules-bar">
        <div class="rule-item">
            <strong>规避:</strong> 每区四族各一人
        </div>
        <div class="rule-item">
            <strong>奖金:</strong> 500×(9-己存活)×(9-敌存活)
        </div>
        <div class="rule-item">
            <span class="camp-badge badge-tiger">虎×8</span>
            <span class="camp-badge badge-bear">熊×8</span>
            <span class="camp-badge badge-ox">牛×8</span>
            <span class="camp-badge badge-hound">犬×8</span>
        </div>
    </div>

    <!-- 标题 -->
    <div class="header">
        <h1>血酬淘汰赛</h1>
        <p>第一届兽盾四营血酬淘汰赛</p>
    </div>

    <!-- 阶段提示 -->
    <div class="stage-hint" id="stageHint">
        <div>阶段：32强抽签中</div>
        <div style="font-size: 0.85em; margin-top: 4px; color: #888;">需填满32个位置</div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 选手池 -->
        <div class="pool-section">
            <div class="pool-header">
                <div class="pool-title">选手池（点击抽签）</div>
                <div class="pool-counter" id="counter">0/32</div>
            </div>
            <div class="pool-scroll" id="poolContainer">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 对阵区 -->
        <div class="bracket-section" id="bracketSection">
            <div class="bracket-title" id="bracketTitle">32强对阵</div>
            <div class="matches-list" id="matchesList">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 冠军区 -->
        <div class="champion-section" id="championSection" style="display: none;">
            <div class="champion-title">🏆 冠军</div>
            <div class="champion-card" id="championCard">
                <div class="champion-empty">待决赛完成</div>
            </div>
        </div>

        <!-- 统计 -->
        <div class="stats-section">
            <div class="stats-box">
                <div class="stats-title">当前奖金系数</div>
                <div class="stats-value" id="multiplierValue">500</div>
            </div>
            <div class="stats-box">
                <div class="stats-title">阵营存活/奖金</div>
                <div class="camp-stats" id="campStats">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <div class="bottom-spacer"></div>
    </div>

    <!-- 底部固定按钮 -->
    <div class="bottom-bar">
        <button class="bottom-btn btn-primary" id="drawBtn" onclick="drawNext()">随机抽签</button>
        <button class="bottom-btn btn-accent" id="autoDrawBtn" onclick="autoDrawAll()">一键抽满</button>
        <button class="bottom-btn btn-secondary" onclick="resetAll()">重置</button>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <!-- 动态内容 -->
        </div>
    </div>

    <script>
        // 选手数据
        const characters = {
            tiger: [
                { name: '锋牙', code: 'E-178', motive: '证明', age: 32, story: '违抗命令救G级兵，理想主义者。曾在战场上为救一名被遗弃的新兵而违抗撤退命令，导致自己负伤。虽不后悔，但因此失去晋升机会，被视为"不懂规矩"的异类。参加血酬淘汰赛是为了证明自己坚守的原则没有错。' },
                { name: '烈影', code: 'E-201', motive: '复仇', age: 27, story: '被兄长卖给赏金猎人，恨意深。出身军人世家，却被亲生兄长设计出卖，沦为赏金猎人的阶下囚。在被追捕的日子里，她发誓要让兄长付出代价。血酬淘汰赛是她获得力量和地位的机会。' },
                { name: '岩爪', code: 'E-156', motive: '生存', age: 35, story: '拒绝处决平民被标记，面临降级。作为一名老兵，他拒绝执行上级要求屠杀平民村的命令，因此被贴上"懦弱"的标签。军方准备将他降级为后勤单位，这是他的最后机会。' },
                { name: '幼爪', code: 'E-312', motive: '救父', age: 20, story: '最年轻，父亲患矿石病。年仅20岁，父亲因长期开采矿石患上重病。为筹集治疗费用，他隐瞒年龄报名参赛。虽然年轻，但战斗天赋惊人，是虎营近年来最有潜力的新星。' },
                { name: '夜瞳', code: 'E-267', motive: '野心', age: 29, story: '纯黑毛色，潜行者，冷静利己。天生纯黑毛色让他在黑暗中如鱼得水，是营中最出色的潜行者。他不相信任何人，只相信自己的实力。参加血酬淘汰赛是为了获得更高的地位和资源。' },
                { name: '风啸', code: 'E-289', motive: '公道', age: 26, story: '伴侣被友军误杀，寻求正义。他的伴侣在一次友军炮火中被误炸身亡，但军方拒绝承认错误。为给爱人讨回公道，他需要力量和话语权，血酬淘汰赛是唯一的途径。' },
                { name: '金纹', code: 'E-223', motive: '荣耀', age: 31, story: '没落贵族后裔，虚荣。出身曾经显赫的贵族家族，如今家道中落。他极度渴望恢复家族荣耀，参加比赛是为了重振家声。虽然能力出众，但过于在意虚名常让他做出冒险的决定。' },
                { name: '残耳', code: 'E-134', motive: '神秘', age: 38, story: '独行者，动机不明。没人知道他的真实来历，也没人知道他的真实目的。右耳残缺，据说是在某次绝密任务中失去。他从不与人交流，只是默默战斗，仿佛在完成某种使命。' }
            ],
            bear: [
                { name: '棕岩', code: 'E-145', motive: '还债', age: 35, story: '弟弟患矿石病，债务一万。弟弟是他唯一的亲人，为了支付昂贵的医疗费，他欠下了巨额债务。作为熊营中的老将，他选择用最擅长的方式——战斗——来还债。' },
                { name: '黑山', code: 'E-112', motive: '赎罪', age: 32, story: '亲手杀死伴侣（被陷害），求死。在一场混战中，他被陷害亲手杀死了自己的伴侣。虽然事后查明真相，但他无法原谅自己。参加比赛是为了求死，或是找到救赎。' },
                { name: '白掌', code: 'E-287', motive: '还债', age: 24, story: '赌马输两万，营房长官债务。年轻气盛时沉迷于赌马，欠下长官巨额债务。为了还清债务，不得不参加血酬淘汰赛。虽然体型魁梧，但内心善良，希望早日脱离这种生活。' },
                { name: '铁背', code: 'E-198', motive: '不甘', age: 38, story: '背肌如铁板，拒绝退役。年过退役年龄，但他的背肌依然如铁板般坚硬。军方要求他退役，但他不甘心。这是他证明自己仍有价值的最后机会。' },
                { name: '灰耳', code: 'E-268', motive: '生存', age: 33, story: '左耳残缺，独耳熊。在一次任务中失去左耳，从此被称为"独耳熊"。伤愈后被建议退役，但他选择用战斗证明自己仍然是一名合格的战士。' },
                { name: '厚掌', code: 'E-290', motive: '野心', age: 29, story: '手掌厚重，可拍碎岩石。天生手掌异常厚重，一掌可碎岩石。他不满足于现状，渴望更高的地位和权力。血酬淘汰赛是他向上爬的阶梯。' },
                { name: '柔毛', code: 'E-224', motive: '证明', age: 27, story: '毛色柔软，性格暴躁。外表看似柔软，性格却异常暴躁。常因外表被轻视，这让他极度渴望证明自己。每次战斗都如同发泄怒火，是营中最具攻击性的战士。' },
                { name: '冬眠', code: 'E-135', motive: '告别', age: 42, story: '最年长，最后的机会。熊营中最年长的战士，身体已经开始衰退。这是他最后一次参加大型比赛的机会。他不求胜利，只希望以战士的身份光荣地结束生涯。' }
            ],
            ox: [
                { name: '铁角', code: 'E-217', motive: '还债', age: 37, story: '前主账房，数学好，背负钱庄债务。曾是营中的账房，精通计算，却因一次投资失败欠下钱庄巨额债务。被迫重返战场，用战斗来偿还债务。' },
                { name: '铜皮', code: 'E-189', motive: '救弟', age: 30, story: '体型最魁梧，弟弟十二岁，兄长情深。体型魁梧如山，内心却极度温柔。十二岁的弟弟是他唯一的牵挂，为了弟弟的未来，他愿意付出一切。' },
                { name: '青石', code: 'E-256', motive: '赌徒', age: 29, story: '精瘦体型，概率计算狂，危险。精瘦体型，却是疯狂的赌徒。痴迷于计算概率，将每场战斗都视为赌局。这种危险的思维方式让他既是天才也是疯子。' },
                { name: '泥蹄', code: 'E-198', motive: '还债', age: 30, story: '搬运工，卑微绝望，求死解脱。曾是普通的搬运工，因家人重病欠下巨债。绝望中选择参赛，内心深处已经放弃生存，只希望解脱前能为家人留下一笔钱。' },
                { name: '砂岩', code: 'E-167', motive: '不想被卖', age: 43, story: '最年长，酗酒，体面赴死。最年长的参赛者，长期酗酒。军方准备将他卖给奴隶商人，他选择参加比赛作为最后的抗争。不求胜利，只求体面地结束。' },
                { name: '岩裂', code: 'E-233', motive: '逃命', age: 24, story: '亡命之徒，已杀人，被追杀。因失手杀人而被通缉的亡命之徒。参加比赛是为了逃避追杀，同时也是为了寻找救赎的机会。' },
                { name: '黑土', code: 'E-245', motive: '救母', age: 35, story: '温柔照顾者，母亲慢性病。性格温柔，是营中的照顾者。母亲患有慢性病需要长期治疗，为了筹集医药费，这位不爱战斗的人也拿起了武器。' },
                { name: '荒原', code: 'E-301', motive: '杀人', age: 22, story: '最年轻，天生杀手，疯狂。最年轻的参赛者，却展现出惊人的杀戮天赋。天生具有战斗直觉，但性格几近疯狂。对他来说，血酬淘汰赛只是一场盛大的游戏。' }
            ],
            hound: [
                { name: '灰影', code: 'E-157', motive: '自由', age: 30, story: '灰狼（野狼出身，渴望回到荒野）。野狼出身，被捕获后训练成军犬。内心深处始终渴望回到荒野。参加比赛是为了获得自由之身，重返大自然。' },
                { name: '黑獒', code: 'E-089', motive: '家', age: 28, story: '藏獒（被遗弃的獒犬，寻找归属）。曾被遗弃的藏獒，一生都在寻找归属。犬营给了他家的感觉，为了保卫这个家，他愿意付出生命。' },
                { name: '铁背', code: 'E-269', motive: '忠诚', age: 31, story: '德牧（追踪者）。德牧血统，出色的追踪者。对营地有着近乎偏执的忠诚。参加比赛的唯一目的就是为营地赢得荣誉。' },
                { name: '疾风', code: 'E-291', motive: '荣耀', age: 25, story: '灵缇（速度最快）。灵缇血统，速度冠绝全营。追求极致的速度与荣耀。对他而言，血酬淘汰赛是证明自己的舞台。' },
                { name: '铁颚', code: 'E-225', motive: '生存', age: 29, story: '斗牛犬（下颚强壮）。斗牛犬血统，下颚力量惊人。从小在街头求生，明白只有强者才能生存的道理。' },
                { name: '雪眼', code: 'E-302', motive: '好奇', age: 22, story: '哈士奇（冰蓝眼睛）。哈士奇血统，拥有迷人的冰蓝眼睛。性格好奇，参加比赛纯粹是想看看自己能走多远。这种天真的态度让其他选手既羡慕又担忧。' },
                { name: '铁锁', code: 'E-136', motive: '最后机会', age: 35, story: '罗威纳（老兵）。罗威纳血统，犬营老兵。多次负伤，这是最后一次参赛的机会。他想用一场完美的退役战来结束军医生涯。' },
                { name: '白毛', code: 'E-199', motive: '证明自己', age: 26, story: '萨摩耶（毛色雪白）。萨摩耶血统，毛色雪白。因外表被误认为软弱，饱受轻视。参加比赛是为了证明白色毛皮下同样流淌着战士的血液。' }
            ]
        };

        const campNames = { tiger: '虎', bear: '熊', ox: '牛', hound: '犬' };
        const campColors = { tiger: '#ff9800', bear: '#8d6e63', ox: '#78909c', hound: '#7986cb' };
        const campIcons = { tiger: '🐯', bear: '🐻', ox: '🐮', hound: '🐺' };

        // 对阵结构
        const bracketStructure = {
            32: { left: Array.from({length: 16}, (_, i) => ({ id: `L32-${i}`, pos: i + 1 })), right: Array.from({length: 16}, (_, i) => ({ id: `R32-${i}`, pos: i + 17 })) },
            16: { left: Array.from({length: 8}, (_, i) => ({ id: `L16-${i}`, pos: i + 1 })), right: Array.from({length: 8}, (_, i) => ({ id: `R16-${i}`, pos: i + 1 })) },
            8: { left: Array.from({length: 4}, (_, i) => ({ id: `L8-${i}`, pos: i + 1 })), right: Array.from({length: 4}, (_, i) => ({ id: `R8-${i}`, pos: i + 1 })) },
            4: { left: Array.from({length: 2}, (_, i) => ({ id: `L4-${i}`, pos: i + 1 })), right: Array.from({length: 2}, (_, i) => ({ id: `R4-${i}`, pos: i + 1 })) },
            2: { left: [{ id: 'L2-0', pos: 1 }], right: [{ id: 'R2-0', pos: 1 }] }
        };

        // 状态
        let state = {
            filledPositions: new Array(32).fill(false),
            drawn: new Set(),
            slots: {},
            winners: {},
            zoneCamps: {},
            stageCompleted: { 32: false, 16: false, 8: false, 4: false, 2: false },
            stageWinners: { 32: 0, 16: 0, 8: 0, 4: 0, 2: 0 },
            campAlive: { tiger: 8, bear: 8, ox: 8, hound: 8 },
            playerMoney: {},
            campMoney: { tiger: 0, bear: 0, ox: 0, hound: 0 }
        };

        let currentRound = 32;
        let isDrawing = false;

        // 初始化
        function init() {
            renderPool();
            renderBracket();
            updateStageHint();
            updateStats();
        }

        // 获取zone
        function getZone(position) {
            return Math.floor(position / 4);
        }

        // 检查可放置位置
        function canPlaceAtPosition(position, camp) {
            if (state.filledPositions[position]) return false;
            const zone = getZone(position);
            if (!state.zoneCamps[zone]) state.zoneCamps[zone] = [];
            return !state.zoneCamps[zone].includes(camp);
        }

        // 找第一个空位
        function findFirstEmptySlot(camp) {
            for (let pos = 0; pos < 32; pos++) {
                if (canPlaceAtPosition(pos, camp)) return pos;
            }
            return -1;
        }

        // 获取所有空位
        function getAllEmptySlots() {
            const empty = [];
            for (let pos = 0; pos < 32; pos++) {
                if (!state.filledPositions[pos]) empty.push(pos + 1);
            }
            return empty;
        }

        // 计算奖金
        function calculateBonus(winnerCamp, loserCamp) {
            const ownAlive = state.campAlive[winnerCamp];
            const otherAlive = state.campAlive[loserCamp];
            return {
                amount: 500 * (9 - ownAlive) * (9 - otherAlive),
                ownFactor: 9 - ownAlive,
                otherFactor: 9 - otherAlive
            };
        }

        // 渲染选手池
        function renderPool() {
            const container = document.getElementById('poolContainer');
            container.innerHTML = Object.keys(characters).map(camp => `
                <div class="pool-camp-box">
                    <div class="pool-camp-header badge-${camp}">${campIcons[camp]} ${campNames[camp]}之阵营</div>
                    <div class="pool-characters">
                        ${characters[camp].map((char, idx) => {
                            const playerId = `${camp}-${idx}`;
                            const money = state.playerMoney[playerId] || 0;
                            const isDrawn = state.drawn.has(playerId);
                            return `
                                <div class="pool-char ${camp} ${isDrawn ? 'drawn' : ''} ${!isDrawn && findFirstEmptySlot(camp) === -1 ? 'disabled' : ''}"
                                     onclick="onPoolCharClick('${camp}', ${idx})">
                                    <span>${char.name}</span>
                                    <span class="char-code">${money > 0 ? '💰' + money : char.code}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 点击选手池
        function onPoolCharClick(camp, idx) {
            if (isDrawing) return;
            if (state.drawn.has(`${camp}-${idx}`)) return;

            const position = findFirstEmptySlot(camp);
            if (position === -1) {
                showModal('提示', '没有可用的空位放置该阵营选手！每个1/8区已有该阵营选手。');
                return;
            }

            placeChar(camp, idx, position);
        }

        // 放置选手
        function placeChar(camp, idx, position) {
            isDrawing = true;
            const char = characters[camp][idx];
            const slotId = position < 16 ? `L32-${position}` : `R32-${position - 16}`;

            state.filledPositions[position] = true;
            state.slots[slotId] = { ...char, camp, idx, position: position + 1, slotId };
            state.drawn.add(`${camp}-${idx}`);

            const zone = getZone(position);
            if (!state.zoneCamps[zone]) state.zoneCamps[zone] = [];
            state.zoneCamps[zone].push(camp);

            showDrawModal(char, camp, position + 1);

            setTimeout(() => {
                renderPool();
                renderBracket();
                updateCounter();
                updateStageHint();
                updateStats();
                isDrawing = false;

                if (getAllEmptySlots().length === 0) {
                    document.getElementById('drawBtn').disabled = true;
                    document.getElementById('autoDrawBtn').disabled = true;
                    hideModal();
                    showModal('抽签完成', '32强全部产生！请选择16强晋级选手。');
                } else {
                    hideModal();
                }
            }, 800);
        }

        // 渲染对阵
        function renderBracket() {
            const container = document.getElementById('matchesList');
            const roundData = bracketStructure[currentRound];
            if (!roundData) return;

            document.getElementById('bracketTitle').textContent = currentRound === 2 ? '决赛' : currentRound + '强对阵';

            const matches = [];
            const leftSide = roundData.left;
            const rightSide = roundData.right;

            for (let i = 0; i < leftSide.length; i += 2) {
                const matchNum = Math.floor(i / 2) + 1;
                const p1 = leftSide[i];
                const p2 = leftSide[i + 1];
                matches.push({ num: matchNum, p1, p2, side: '左' });
            }

            for (let i = 0; i < rightSide.length; i += 2) {
                const matchNum = Math.floor(leftSide.length / 2) + Math.floor(i / 2) + 1;
                const p1 = rightSide[i];
                const p2 = rightSide[i + 1];
                matches.push({ num: matchNum, p1, p2, side: '右' });
            }

            container.innerHTML = matches.map(m => {
                const p1Data = state.slots[m.p1.id];
                const p2Data = state.slots[m.p2.id];
                const p1Winner = state.winners[m.p1.id];
                const p2Winner = state.winners[m.p2.id];

                return `
                    <div class="match-item">
                        <div class="match-number">${m.side}${m.num}</div>
                        <div class="match-players">
                            ${renderMatchPlayer(m.p1.id, p1Data, p1Winner, p2Winner)}
                            <div class="vs-divider">VS</div>
                            ${renderMatchPlayer(m.p2.id, p2Data, p2Winner, p1Winner)}
                        </div>
                    </div>
                `;
            }).join('');

            // 显示冠军
            if (state.stageCompleted[2]) {
                document.getElementById('championSection').style.display = 'block';
            } else {
                document.getElementById('championSection').style.display = 'none';
            }
        }

        // 渲染比赛选手
        function renderMatchPlayer(slotId, data, isWinner, opponentIsWinner) {
            if (!data) {
                return `<div class="match-player empty">待定</div>`;
            }

            const playerId = `${data.camp}-${data.idx}`;
            const money = state.playerMoney[playerId] || 0;
            const isEliminated = opponentIsWinner && !isWinner;

            return `
                <div class="match-player ${data.camp} ${isWinner ? 'winner' : ''} ${isEliminated ? 'eliminated' : ''}"
                     onclick="onMatchPlayerClick('${slotId}')">
                    <div class="player-info">
                        <div class="player-name">${campIcons[data.camp]} ${data.name}</div>
                        <div class="player-meta">${data.code} · ${data.motive}</div>
                    </div>
                    ${money > 0 ? `<div class="player-money">💰${money.toLocaleString()}</div>` : ''}
                </div>
            `;
        }

        // 点击比赛选手
        function onMatchPlayerClick(slotId) {
            const data = state.slots[slotId];
            if (!data) return;

            // 检查是否可以选择胜者
            if (!canSelectWinner(currentRound)) {
                showModal('提示', '需先完成当前阶段！');
                return;
            }

            // 显示详情弹窗
            showCharModal(data);
        }

        // 检查是否可选择胜者
        function canSelectWinner(round) {
            if (round === 32) return getAllEmptySlots().length === 0;
            if (round === 16) return state.stageCompleted[32];
            if (round === 8) return state.stageCompleted[16];
            if (round === 4) return state.stageCompleted[8];
            if (round === 2) return state.stageCompleted[4];
            return false;
        }

        // 显示选手详情弹窗
        function showCharModal(data) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');

            const opponentId = findOpponentId(data.slotId);
            const opponent = opponentId ? state.slots[opponentId] : null;
            const canSelect = canSelectWinner(currentRound);
            const isWinner = state.winners[data.slotId];
            const opponentWinner = opponentId && state.winners[opponentId];

            let buttons = '';
            if (canSelect && !opponentWinner && opponent) {
                if (isWinner) {
                    buttons = `<button class="modal-close" onclick="clearWinner('${data.slotId}')" style="background: #666;">取消晋级</button>`;
                } else {
                    buttons = `<button class="modal-close" onclick="selectWinner('${data.slotId}')">选择晋级</button>`;
                }
            }

            content.innerHTML = `
                <div class="char-modal-content">
                    <div class="char-modal-header">
                        <div>
                            <div class="char-modal-name">${campIcons[data.camp]} ${data.name}</div>
                            <div class="char-modal-code">${data.code}</div>
                        </div>
                    </div>
                    <div class="char-modal-story">${data.story}</div>
                    <div class="char-modal-info">
                        <div class="char-modal-info-item">
                            <span class="char-modal-label">动机：</span>
                            <span class="char-modal-value">${data.motive}</span>
                        </div>
                        <div class="char-modal-info-item">
                            <span class="char-modal-label">年龄：</span>
                            <span class="char-modal-value">${data.age}岁</span>
                        </div>
                    </div>
                    ${buttons ? `<div style="margin-top: 20px;">${buttons}</div>` : ''}
                    <button class="modal-close" onclick="hideModal()" style="margin-top: 10px; background: transparent; border: 1px solid #666;">关闭</button>
                </div>
            `;
            modal.classList.add('active');
        }

        // 选择胜者
        function selectWinner(slotId) {
            const data = state.slots[slotId];
            if (!data) return;

            const opponentId = findOpponentId(slotId);
            const opponent = opponentId ? state.slots[opponentId] : null;

            // 计算奖金
            const bonus = calculateBonus(data.camp, opponent ? opponent.camp : data.camp);
            const playerId = `${data.camp}-${data.idx}`;

            if (!state.playerMoney[playerId]) state.playerMoney[playerId] = 0;
            state.playerMoney[playerId] += bonus.amount;
            state.campMoney[data.camp] += bonus.amount;

            // 更新存活
            if (opponentId && state.slots[opponentId]) {
                state.campAlive[opponent.camp]--;
            }

            // 更新阶段胜者数
            state.stageWinners[currentRound]++;

            // 检查阶段完成
            const required = currentRound === 32 ? 16 : currentRound === 16 ? 8 : currentRound === 8 ? 4 : currentRound === 4 ? 2 : 1;
            if (state.stageWinners[currentRound] >= required) {
                state.stageCompleted[currentRound] = true;
            }

            // 标记胜者
            state.winners[slotId] = true;

            // 晋级到下一轮
            if (currentRound > 2) {
                const nextRound = currentRound === 32 ? 16 : currentRound === 16 ? 8 : currentRound === 8 ? 4 : 2;
                const matchIndex = parseInt(slotId.match(/\d+$/)[0]);
                const nextSlotId = slotId.charAt(0) + nextRound + '-' + Math.floor(matchIndex / 2);
                state.slots[nextSlotId] = { ...data, slotId: nextSlotId };
            } else if (currentRound === 2) {
                // 冠军
                document.getElementById('championCard').innerHTML = `
                    <div class="champion-name">${campIcons[data.camp]} ${data.name}</div>
                    <div class="champion-camp">${campNames[data.camp]}之阵营 · ${data.code}</div>
                    <div class="champion-money">累计 💰 ${state.playerMoney[playerId].toLocaleString()}</div>
                `;
            }

            hideModal();
            renderPool();
            renderBracket();
            updateStageHint();
            updateStats();
        }

        // 取消胜者
        function clearWinner(slotId) {
            // 简化版：刷新页面重置
            hideModal();
            showModal('提示', '取消晋级功能请使用重置按钮。');
        }

        // 找对手ID
        function findOpponentId(slotId) {
            const prefix = slotId.charAt(0);
            const round = parseInt(slotId.match(/\d+/)[0]);
            const index = parseInt(slotId.match(/\d+$/)[0]);

            const roundKey = round;
            if (!bracketStructure[roundKey]) return null;

            const side = bracketStructure[roundKey][prefix === 'L' ? 'left' : 'right'];
            const pairIndex = index % 2 === 0 ? index + 1 : index - 1;

            if (pairIndex >= 0 && pairIndex < side.length) {
                return side[pairIndex].id;
            }
            return null;
        }

        // 随机抽签
        function drawNext() {
            if (isDrawing) return;

            const emptySlots = getAllEmptySlots();
            if (emptySlots.length === 0) {
                showModal('提示', '抽签已完成！');
                return;
            }

            const availableCamps = Object.keys(characters).filter(camp => findFirstEmptySlot(camp) !== -1);
            if (availableCamps.length === 0) {
                showModal('提示', '无法继续抽签，规避规则导致无可用位置！');
                return;
            }

            const camp = availableCamps[Math.floor(Math.random() * availableCamps.length)];
            const position = findFirstEmptySlot(camp);

            const availableChars = characters[camp].filter((_, idx) => !state.drawn.has(`${camp}-${idx}`));
            const charIdx = Math.floor(Math.random() * availableChars.length);
            const char = availableChars[charIdx];
            const originalIdx = characters[camp].indexOf(char);

            placeChar(camp, originalIdx, position);
        }

        // 一键抽满
        async function autoDrawAll() {
            if (isDrawing) return;

            const emptySlots = getAllEmptySlots();
            if (emptySlots.length === 0) {
                showModal('提示', '抽签已完成！');
                return;
            }

            document.getElementById('drawBtn').disabled = true;
            document.getElementById('autoDrawBtn').disabled = true;

            while (getAllEmptySlots().length > 0) {
                const availableCamps = Object.keys(characters).filter(camp => findFirstEmptySlot(camp) !== -1);
                if (availableCamps.length === 0) break;

                const camp = availableCamps[Math.floor(Math.random() * availableCamps.length)];
                const position = findFirstEmptySlot(camp);

                const availableChars = characters[camp].filter((_, idx) => !state.drawn.has(`${camp}-${idx}`));
                if (availableChars.length === 0) continue;

                const charIdx = Math.floor(Math.random() * availableChars.length);
                const char = availableChars[charIdx];
                const originalIdx = characters[camp].indexOf(char);

                // 直接放置，不显示动画
                state.filledPositions[position] = true;
                const slotId = position < 16 ? `L32-${position}` : `R32-${position - 16}`;
                state.slots[slotId] = { ...char, camp, idx: originalIdx, position: position + 1, slotId };
                state.drawn.add(`${camp}-${originalIdx}`);

                const zone = getZone(position);
                if (!state.zoneCamps[zone]) state.zoneCamps[zone] = [];
                state.zoneCamps[zone].push(camp);

                await new Promise(r => setTimeout(r, 50));
            }

            hideModal();
            renderPool();
            renderBracket();
            updateCounter();
            updateStageHint();
            updateStats();

            document.getElementById('drawBtn').disabled = true;
            document.getElementById('autoDrawBtn').disabled = true;
            showModal('抽签完成', '32强全部产生！请选择16强晋级选手。');
        }

        // 更新计数器
        function updateCounter() {
            const filled = state.filledPositions.filter(p => p).length;
            document.getElementById('counter').textContent = `${filled}/32`;
        }

        // 更新阶段提示
        function updateStageHint() {
            const hint = document.getElementById('stageHint');
            const emptySlots = getAllEmptySlots().length;

            if (emptySlots > 0) {
                hint.innerHTML = '<div>阶段：32强抽签中</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">需填满32个位置</div>';
                hint.className = 'stage-hint';
                currentRound = 32;
            } else if (!state.stageCompleted[32]) {
                const needed = 16 - state.stageWinners[32];
                hint.innerHTML = `<div>阶段：16强晋级中</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">需选择16名胜者 (剩余${needed})</div>`;
                hint.className = needed === 0 ? 'stage-hint completed' : 'stage-hint';
                currentRound = 32;
            } else if (!state.stageCompleted[16]) {
                const needed = 8 - state.stageWinners[16];
                hint.innerHTML = `<div>阶段：8强晋级中</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">需选择8名胜者 (剩余${needed})</div>`;
                hint.className = needed === 0 ? 'stage-hint completed' : 'stage-hint';
                currentRound = 16;
            } else if (!state.stageCompleted[8]) {
                const needed = 4 - state.stageWinners[8];
                hint.innerHTML = `<div>阶段：半决赛晋级中</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">需选择4名胜者 (剩余${needed})</div>`;
                hint.className = needed === 0 ? 'stage-hint completed' : 'stage-hint';
                currentRound = 8;
            } else if (!state.stageCompleted[4]) {
                const needed = 2 - state.stageWinners[4];
                hint.innerHTML = `<div>阶段：决赛晋级中</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">需选择2名胜者 (剩余${needed})</div>`;
                hint.className = needed === 0 ? 'stage-hint completed' : 'stage-hint';
                currentRound = 4;
            } else if (!state.stageCompleted[2]) {
                hint.innerHTML = '<div>阶段：冠军诞生</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">点击决赛选手查看详情</div>';
                hint.className = 'stage-hint completed';
                currentRound = 2;
            } else {
                hint.innerHTML = '<div>比赛结束</div><div style="font-size: 0.85em; margin-top: 4px; color: #888;">冠军已产生</div>';
                hint.className = 'stage-hint completed';
                currentRound = 2;
            }
        }

        // 更新统计
        function updateStats() {
            // 计算当前可能的奖金
            let minBonus = Infinity, maxBonus = 0;
            Object.keys(state.campAlive).forEach(camp => {
                const ownFactor = 9 - state.campAlive[camp];
                Object.keys(state.campAlive).forEach(otherCamp => {
                    if (otherCamp !== camp) {
                        const otherFactor = 9 - state.campAlive[otherCamp];
                        const bonus = 500 * ownFactor * otherFactor;
                        minBonus = Math.min(minBonus, bonus);
                        maxBonus = Math.max(maxBonus, bonus);
                    }
                });
            });

            if (minBonus === maxBonus) {
                document.getElementById('multiplierValue').textContent = maxBonus.toLocaleString();
            } else {
                document.getElementById('multiplierValue').textContent = `${minBonus.toLocaleString()}-${maxBonus.toLocaleString()}`;
            }

            // 阵营统计
            document.getElementById('campStats').innerHTML = Object.keys(campNames).map(camp => `
                <div class="camp-stat-item">
                    <span><span class="camp-badge badge-${camp}">${campNames[camp]}</span> ${state.campAlive[camp]}人</span>
                    <span style="color: #ffd700;">${state.campMoney[camp].toLocaleString()}</span>
                </div>
            `).join('');
        }

        // 显示弹窗
        function showModal(title, text) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="modal-content draw-modal-content">
                    <div class="modal-title">${title}</div>
                    <div class="modal-text">${text}</div>
                    <button class="modal-close" onclick="hideModal()">确定</button>
                </div>
            `;
            modal.classList.add('active');
        }

        // 显示抽签弹窗
        function showDrawModal(char, camp, position) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="modal-content draw-modal-content">
                    <div class="draw-camp" style="color: ${campColors[camp]}">${campNames[camp]}之阵营</div>
                    <div class="draw-name">${char.name}</div>
                    <div class="draw-position">签位 #${position}</div>
                </div>
            `;
            modal.classList.add('active');
        }

        // 隐藏弹窗
        function hideModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 重置
        function resetAll() {
            state = {
                filledPositions: new Array(32).fill(false),
                drawn: new Set(),
                slots: {},
                winners: {},
                zoneCamps: {},
                stageCompleted: { 32: false, 16: false, 8: false, 4: false, 2: false },
                stageWinners: { 32: 0, 16: 0, 8: 0, 4: 0, 2: 0 },
                campAlive: { tiger: 8, bear: 8, ox: 8, hound: 8 },
                playerMoney: {},
                campMoney: { tiger: 0, bear: 0, ox: 0, hound: 0 }
            };
            currentRound = 32;
            isDrawing = false;

            document.getElementById('drawBtn').disabled = false;
            document.getElementById('autoDrawBtn').disabled = false;
            document.getElementById('championCard').innerHTML = '<div class="champion-empty">待决赛完成</div>';

            init();
        }

        // 启动
        init();
    </script>
</body>
</html>
