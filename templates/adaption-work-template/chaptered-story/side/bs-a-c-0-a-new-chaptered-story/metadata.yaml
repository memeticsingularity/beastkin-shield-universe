# ============================================
# Beastkin Universe Metadata Template for Adaptation Chaptered Story
# 兽盾宇宙改编分章故事元数据模板
# ============================================
# Compatible with Naming Guide v2.3.0
# 适配命名指南 v2.3.0
# For adaptation works (nature: a)
# 用于改编作品（性质: a）

work:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  code: "bs-a-cs-1-template-adaptation"
  # Format: [world]-a-[form_type]-[natural_number]-[series_name]
  # 格式: [世界观]-a-[形式类型]-[自然数序号]-[系列名]
  # form_type can be cm or cs depending on adaptation type
  # 形式类型根据改编类型可以是cm或cs

  title:
    chinese: "改编故事模板标题"
    english: "Adaptation Story Template Title"

  format: "chaptered-story"
  form_type: "cs"  # Use "cm" for main story adaptation, "cs" for side story adaptation
  status: "updating"
  location: "adaptation-works"  # Fixed for adaptation works

  # ============================================
  # CONDITIONALLY REQUIRED FIELDS / 条件必填字段
  # ============================================

  subtype: "side"  # For form_type: "cs", automatically side

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  promotion_status: "eligible"  # Adaptation works can be eligible for promotion

  # Work Type Detail - For adaptation works
  # 作品类型细分 - 用于改编作品
  work_type: "direct-adaptation"  # direct-adaptation, reimagined, theme-inversion, etc.

  tags:
    - "template"
    - "adaptation"
    - "faithful"  # or "reimagined", "theme-inversion" based on approach
    - "character-expansion"
    - "adapted-from-dark"  # if adapting from dark original

  # ============================================
  # OPTIONAL FIELDS / 可选字段
  # ============================================

  # Inspiration Sources - For adaptation works
  # 灵感来源 - 用于改编作品
  inspiration_sources:
    - type: "direct-adaptation"
      original_code: "bs-o-s-6-night-raid"  # Example original work
      description: "Adapted from 'Night Raid' with theme inversion"

  content_warnings:
    - "violence"
    - "sexual-content"
    - "dark-themes"

  reading_time_estimate:
    minutes: 180

  target_audience: "mature"

creation:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  author: "Your Name"
  start_date: "2025-12-15"

  # ============================================
  # CONDITIONALLY REQUIRED FIELDS / 条件必填字段
  # ============================================

  # Adaptation Information - REQUIRED for adaptation works
  # 改编信息 - 改编作品必填
  adaptation_info:
    original_work: "bs-o-s-6-night-raid"  # Code of original work
    original_title: "夜袭"  # Title of original work
    original_author: "Original Author"  # Author of original work (optional)
    adaptation_approach: "theme-inversion"  # faithful, reimagined, loose, theme-inversion
    key_changes: |
      Template summary of key changes made during adaptation.
      
      1. Changed protagonist's role from tormentor to redeemer
      2. Transformed theme from dark curiosity to gentle healing
      3. Modified ending from tragic death to hopeful new beginning
      4. Expanded character backstory and motivations
      5. Added additional scenes for character development

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  last_update: "2025-12-15"
  universe_based_on: "beastshield"

  # ============================================
  # OPTIONAL FIELDS / 可选字段
  # ============================================

  # Original Code - For adaptation works (alternative to adaptation_info)
  # 原作编码 - 用于改编作品（adaptation_info的替代）
  original_code: "bs-o-s-6-night-raid"

  license:
    type: "CC-BY-NC-SA-4.0"
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  revision_history:
    - version: "1.0"
      date: "2025-12-15"
      changes: "Initial adaptation draft / 初始改编草稿"
    - version: "1.1"
      date: "2025-12-20"
      changes: "Expanded character development in chapters 3-5 / 在第3-5章扩展角色发展"