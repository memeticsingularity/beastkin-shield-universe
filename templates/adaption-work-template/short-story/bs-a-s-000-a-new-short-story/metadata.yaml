# ============================================
# Beastkin Universe Metadata Template for Adaptation Short Story
# 兽盾宇宙改编短篇故事元数据模板
# ============================================
# Compatible with Naming Guide v2.3.0
# 适配命名指南 v2.3.0
# For adaptation short stories (nature: a, form_type: s)
# 用于改编短篇故事（性质: a, 形式类型: s）

work:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  code: "bs-a-s-1-template-short-adaptation"
  # Format: [world]-a-s-[natural_number]-[story_name]
  # 格式: [世界观]-a-s-[自然数序号]-[故事名]

  title:
    chinese: "改编短篇模板标题"
    english: "Adaptation Short Story Template Title"

  format: "short-story"
  form_type: "s"  # s for short story
  status: "completed"  # Short stories are often completed
  location: "adaptation-works"

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  promotion_status: "eligible"
  work_type: "adapted-expansion"

  tags:
    - "template"
    - "adaptation"
    - "short-story"
    - "one-shot"
    - "theme-inversion"
    - "adapted-from-dark"

  # ============================================
  # OPTIONAL FIELDS / 可选字段
  # ============================================

  inspiration_sources:
    - type: "direct-adaptation"
      original_code: "bs-o-s-1-farm-inn"
      description: "Expanded version of the original farm inn scene"

  content_warnings:
    - "dark-themes"
    - "violence"

  reading_time_estimate:
    minutes: 45

  target_audience: "mature"

  # Related Works - Links to related works
  # 相关作品 - 关联作品的链接
  related_works:
    - code: "bs-o-s-1-farm-inn"
      relation_type: "adapted-from"

creation:
  # ============================================
  # REQUIRED FIELDS / 必填字段
  # ============================================

  author: "Your Name"
  start_date: "2025-12-15"

  # ============================================
  # CONDITIONALLY REQUIRED FIELDS / 条件必填字段
  # ============================================

  adaptation_info:
    original_work: "bs-o-s-1-farm-inn"
    original_title: "农场旅馆"
    adaptation_approach: "reimagined"  # faithful, reimagined, loose, theme-inversion
    key_changes: |
      Template summary of key changes made during adaptation.
      
      1. Expanded the original scene into a complete narrative
      2. Added character internal monologue and motivations
      3. Changed perspective to focus on different characters
      4. Extended the ending to provide closure

  # ============================================
  # RECOMMENDED FIELDS / 推荐字段
  # ============================================

  last_update: "2025-12-15"
  universe_based_on: "beastshield"

  # ============================================
  # OPTIONAL FIELDS / 可选字段
  # ============================================

  original_code: "bs-o-s-1-farm-inn"

  # Translator - If translated
  # 翻译者 - 如果是翻译作品
  translator: "Translator Name"

  license:
    type: "CC-BY-NC-SA-4.0"
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"

  publication:
    platforms:
      - "GitHub Repository"
      - "AO3"
    primary_platform: "GitHub Repository"
    urls:
      - "https://github.com/beastkin-universe"